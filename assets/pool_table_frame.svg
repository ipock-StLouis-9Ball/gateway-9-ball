<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Gradients and filters unchanged -->
    <linearGradient id="white-oak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ab9e87"/>
      <stop offset="25%" stop-color="#e8dfcc"/>
      <stop offset="50%" stop-color="#f7f3e8"/>
      <stop offset="75%" stop-color="#e8dfcc"/>
      <stop offset="100%" stop-color="#6e6350"/>
    </linearGradient>

    <linearGradient id="polished-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a6370"/>
      <stop offset="15%" stop-color="#cfd6df"/>
      <stop offset="35%" stop-color="#9ba5b5"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f8fafd"/>
      <stop offset="85%" stop-color="#e3e8ee"/>
      <stop offset="100%" stop-color="#2a3038"/>
    </linearGradient>

    <linearGradient id="polished-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3507"/>
      <stop offset="20%" stop-color="#e6b73c"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#ffd700"/>
      <stop offset="85%" stop-color="#fff2a3"/>
      <stop offset="100%" stop-color="#261b02"/>
    </linearGradient>

    <radialGradient id="ruby" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="30%" stop-color="#ff1e43"/>
      <stop offset="75%" stop-color="#b3001b"/>
      <stop offset="100%" stop-color="#52000a"/>
    </radialGradient>

    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="2.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer frame -->
  <rect x="100" y="100" width="1400" height="700" rx="40" fill="url(#white-oak)" stroke="url(#polished-silver)" stroke-width="6"/>

  <!-- Corner pockets (symmetrical arcs) -->
  <g fill="url(#polished-gold)" stroke="#4a3507" stroke-width="0.5">
    <path d="M180,240 A60,60 0 0,1 240,180 L230,170 A70,70 0 0,0 170,230 Z"/>
    <path d="M1360,180 A60,60 0 0,1 1420,240 L1430,230 A70,70 0 0,0 1370,170 Z"/>
    <path d="M240,720 A60,60 0 0,1 180,660 L170,670 A70,70 0 0,0 230,730 Z"/>
    <path d="M1420,660 A60,60 0 0,1 1360,720 L1370,730 A70,70 0 0,0 1430,670 Z"/>
  </g>

  <!-- Side pockets (centered and aligned) -->
  <g fill="url(#polished-gold)" stroke="#4a3507" stroke-width="0.5">
    <path d="M750,180 A50,50 0 0,0 850,180 L845,170 A60,60 0 0,1 755,170 Z"/>
    <path d="M850,720 A50,50 0 0,0 750,720 L755,730 A60,60 0 0,1 845,730 Z"/>
  </g>

  <!-- Neon rails -->
  <g fill="none" stroke="#C41E3A" stroke-width="4.5" filter="url(#neon)" stroke-linejoin="round">
    <path d="M240,180 L1360,180"/>
    <path d="M1420,240 L1420,660"/>
    <path d="M1360,720 L240,720"/>
    <path d="M180,660 L180,240"/>
  </g>

  <!-- Ruby gems -->
  <g fill="url(#ruby)" stroke="#3b1116" stroke-width="1.2">
    <polygon points="135,300 140,306 135,312 130,306"/>
    <polygon points="1465,300 1470,306 1465,312 1460,306"/>
    <polygon points="320,135 326,140 332,135 326,130"/>
    <polygon points="1280,135 1286,140 1292,135 1286,130"/>
    <polygon points="320,765 326,770 332,765 326,760"/>
    <polygon points="1280,765 1286,770 1292,765 1286,760"/>
  </g>
</svg>
