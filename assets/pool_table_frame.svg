      <stop offset="88%" stop-color="#e3e8ee" />
      <stop offset="100%" stop-color="#2a3038" />
    </linearGradient>

    <!-- 24 KARAT SHINY POLISHED GOLD GRADIENT (Inner Pockets) -->
    <linearGradient id="polished-gold-24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61460b" />
      <stop offset="15%" stop-color="#e6b73c" />
