<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">

  <!-- TRANSPARENT CENTER -->
  <rect x="0" y="0" width="1200" height="700" fill="none"/>

  <!-- METAL OUTER FRAME -->
  <rect x="20" y="20" width="1160" height="660" rx="24" ry="24" fill="#3f3f3f"/>
  <rect x="40" y="40" width="1120" height="620" rx="20" ry="20" fill="#606060"/>

  <!-- BUMPER CUSHIONS -->
  <!-- Top -->
  <rect x="100" y="80" width="1000" height="24" fill="#1b1b1b"/>
  <!-- Bottom -->
  <rect x="100" y="596" width="1000" height="24" fill="#1b1b1b"/>
  <!-- Left -->
  <rect x="80" y="100" width="24" height="500" fill="#1b1b1b"/>
  <!-- Right -->
  <rect x="1096" y="100" width="24" height="500" fill="#1b1b1b"/>

  <!-- POCKET CUTOUTS -->
  <circle cx="100" cy="100" r="30" fill="none"/>
  <circle cx="1100" cy="100" r="30" fill="none"/>
  <circle cx="100" cy="600" r="30" fill="none"/>
  <circle cx="1100" cy="600" r="30" fill="none"/>
  <circle cx="600" cy="100" r="30" fill="none"/>
  <circle cx="600" cy="600" r="30" fill="none"/>

  <!-- BRUNSWICK DIAMONDS -->
  <g fill="#ff2b3b" stroke="#4b0713" stroke-width="1.5">

    <!-- LONG RAILS (4 diamonds each) -->
    <!-- Top rail diamonds at y = 60 -->
    <rect x="350" y="54" width="12" height="12" transform="rotate(45 356 60)"/>
    <rect x="600" y="54" width="12" height="12" transform="rotate(45 606 60)"/>
    <rect x="850" y="54" width="12" height="12" transform="rotate(45 856 60)"/>

    <!-- Bottom rail diamonds at y = 620 -->
    <rect x="350" y="614" width="12" height="12" transform="rotate(45 356 620)"/>
    <rect x="600" y="614" width="12" height="12" transform="rotate(45 606 620)"/>
    <rect x="850" y="614" width="12" height="12" transform="rotate(45 856 620)"/>

    <!-- SHORT RAILS (3 diamonds each) -->
    <!-- Left rail diamonds at x = 60 -->
    <rect x="54" y="260" width="12" height="12" transform="rotate(45 60 266)"/>
    <rect x="54" y="350" width="12" height="12" transform="rotate(45 60 356)"/>
    <rect x="54" y="440" width="12" height="12" transform="rotate(45 60 446)"/>

    <!-- Right rail diamonds at x = 1140 -->
    <rect x="1134" y="260" width="12" height="12" transform="rotate(45 1140 266)"/>
    <rect x="1134" y="350" width="12" height="12" transform="rotate(45 1140 356)"/>
    <rect x="1134" y="440" width="12" height="12" transform="rotate(45 1140 446)"/>

  </g>

</svg>
