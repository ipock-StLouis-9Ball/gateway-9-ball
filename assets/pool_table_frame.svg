<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">

  <!-- TABLE BACKGROUND -->
  <rect width="1000" height="500" fill="#0b5c2b"/>

  <!-- PLAYFIELD (INNER) -->
  <!-- Playfield from (60,60) to (940,440) -->
  <rect x="60" y="60" width="880" height="380" fill="#0f7c3a"/>

  <!-- RAILS (WOOD) -->
  <!-- Top & bottom -->
  <rect x="0" y="0" width="1000" height="60" fill="#b27a3f"/>
  <rect x="0" y="440" width="1000" height="60" fill="#b27a3f"/>
  <!-- Left & right -->
  <rect x="0" y="60" width="60" height="380" fill="#b27a3f"/>
  <rect x="940" y="60" width="60" height="380" fill="#b27a3f"/>

  <!-- POCKETS (CENTERS AT CORNERS + MIDS) -->
  <!-- Corner pockets -->
  <circle cx="60" cy="60" r="26" fill="#000"/>
  <circle cx="940" cy="60" r="26" fill="#000"/>
  <circle cx="60" cy="440" r="26" fill="#000"/>
  <circle cx="940" cy="440" r="26" fill="#000"/>
  <!-- Side pockets -->
  <circle cx="500" cy="60" r="26" fill="#000"/>
  <circle cx="500" cy="440" r="26" fill="#000"/>

  <!-- CUSHIONS (SURROUNDING PLAYFIELD) -->
  <!-- Top cushion -->
  <rect x="86" y="60" width="828" height="18" fill="#145c35"/>
  <!-- Bottom cushion -->
  <rect x="86" y="422" width="828" height="18" fill="#145c35"/>
  <!-- Left cushion -->
  <rect x="60" y="86" width="18" height="328" fill="#145c35"/>
  <!-- Right cushion -->
  <rect x="922" y="86" width="18" height="328" fill="#145c35"/>

  <!-- DIAMONDS (TRUE GRID POSITIONS) -->
  <!-- Diamonds are rotated squares on rail centers -->

  <!-- Top rail diamonds (y = 30) -->
  <!-- Between left corner (60) and top side (500): 3 diamonds -->
  <rect x="170" y="24" width="12" height="12" fill="#fff" transform="rotate(45 176 30)"/>
  <rect x="280" y="24" width="12" height="12" fill="#fff" transform="rotate(45 286 30)"/>
  <rect x="390" y="24" width="12" height="12" fill="#fff" transform="rotate(45 396 30)"/>
  <!-- Between top side (500) and right corner (940): 3 diamonds -->
  <rect x="610" y="24" width="12" height="12" fill="#fff" transform="rotate(45 616 30)"/>
  <rect x="720" y="24" width="12" height="12" fill="#fff" transform="rotate(45 726 30)"/>
  <rect x="830" y="24" width="12" height="12" fill="#fff" transform="rotate(45 836 30)"/>

  <!-- Bottom rail diamonds (y = 470) -->
  <rect x="170" y="464" width="12" height="12" fill="#fff" transform="rotate(45 176 470)"/>
  <rect x="280" y="464" width="12" height="12" fill="#fff" transform="rotate(45 286 470)"/>
  <rect x="390" y="464" width="12" height="12" fill="#fff" transform="rotate(45 396 470)"/>
  <rect x="610" y="464" width="12" height="12" fill="#fff" transform="rotate(45 616 470)"/>
  <rect x="720" y="464" width="12" height="12" fill="#fff" transform="rotate(45 726 470)"/>
  <rect x="830" y="464" width="12" height="12" fill="#fff" transform="rotate(45 836 470)"/>

  <!-- Left rail diamonds (x = 30) -->
  <!-- Between top corner (60) and bottom corner (440): 3 diamonds -->
  <rect x="24" y="150" width="12" height="12" fill="#fff" transform="rotate(45 30 156)"/>
  <rect x="24" y="250" width="12" height="12" fill="#fff" transform="rotate(45 30 256)"/>
  <rect x="24" y="350" width="12" height="12" fill="#fff" transform="rotate(45 30 356)"/>

  <!-- Right rail diamonds (x = 970) -->
  <rect x="964" y="150" width="12" height="12" fill="#fff" transform="rotate(45 970 156)"/>
  <rect x="964" y="250" width="12" height="12" fill="#fff" transform="rotate(45 970 256)"/>
  <rect x="964" y="350" width="12" height="12" fill="#fff" transform="rotate(45 970 356)"/>

</svg>
