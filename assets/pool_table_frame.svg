<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">

  <!-- TABLE BACKGROUND -->
  <rect width="1000" height="500" fill="#2b2b2b"/>

  <!-- FELT -->
  <rect x="60" y="60" width="880" height="380" fill="#0b5c2b"/>

  <!-- POCKETS (centers) -->
  <circle cx="60" cy="60" r="28" fill="black"/>
  <circle cx="500" cy="60" r="28" fill="black"/>
  <circle cx="940" cy="60" r="28" fill="black"/>
  <circle cx="60" cy="440" r="28" fill="black"/>
  <circle cx="500" cy="440" r="28" fill="black"/>
  <circle cx="940" cy="440" r="28" fill="black"/>

  <!-- RAILS -->
  <rect x="0" y="0" width="1000" height="60" fill="#c8b28a"/>
  <rect x="0" y="440" width="1000" height="60" fill="#c8b28a"/>
  <rect x="0" y="60" width="60" height="380" fill="#c8b28a"/>
  <rect x="940" y="60" width="60" height="380" fill="#c8b28a"/>

  <!-- CUSHIONS (simple straight) -->
  <rect x="88" y="60" width="824" height="16" fill="#1b1b1b"/>
  <rect x="88" y="424" width="824" height="16" fill="#1b1b1b"/>
  <rect x="60" y="88" width="16" height="324" fill="#1b1b1b"/>
  <rect x="924" y="88" width="16" height="324" fill="#1b1b1b"/>

  <!-- DIAMONDS (18 total) -->
  <!-- TOP RAIL: 7 diamonds between corner pockets -->
  <!-- Rail span: from x=88 to x=912 (824 wide) -->
  <!-- Positions: divide into 8 segments, diamonds at 1..7 -->
  <g fill="#ffffff" stroke="#000" stroke-width="1">
    <!-- Top rail diamonds -->
    <rect x="88"  y="30" width="10" height="10" transform="rotate(45 93 35)"/>
    <rect x="191" y="30" width="10" height="10" transform="rotate(45 196 35)"/>
    <rect x="294" y="30" width="10" height="10" transform="rotate(45 299 35)"/>
    <rect x="397" y="30" width="10" height="10" transform="rotate(45 402 35)"/>
    <rect x="500" y="30" width="10" height="10" transform="rotate(45 505 35)"/>
    <rect x="603" y="30" width="10" height="10" transform="rotate(45 608 35)"/>
    <rect x="706" y="30" width="10" height="10" transform="rotate(45 711 35)"/>

    <!-- Bottom rail diamonds (mirror) -->
    <rect x="88"  y="460" width="10" height="10" transform="rotate(45 93 465)"/>
    <rect x="191" y="460" width="10" height="10" transform="rotate(45 196 465)"/>
    <rect x="294" y="460" width="10" height="10" transform="rotate(45 299 465)"/>
    <rect x="397" y="460" width="10" height="10" transform="rotate(45 402 465)"/>
    <rect x="500" y="460" width="10" height="10" transform="rotate(45 505 465)"/>
    <rect x="603" y="460" width="10" height="10" transform="rotate(45 608 465)"/>
    <rect x="706" y="460" width="10" height="10" transform="rotate(45 711 465)"/>

    <!-- Left rail diamonds: 2 centered between corners -->
    <rect x="30" y="170" width="10" height="10" transform="rotate(45 35 175)"/>
    <rect x="30" y="330" width="10" height="10" transform="rotate(45 35 335)"/>

    <!-- Right rail diamonds: 2 centered between corners -->
    <rect x="960" y="170" width="10" height="10" transform="rotate(45 965 175)"/>
    <rect x="960" y="330" width="10" height="10" transform="rotate(45 965 335)"/>
  </g>

</svg>
