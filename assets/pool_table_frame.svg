<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- White Oak Wood Gradients for 3D Rail Texture -->
    <linearGradient id="white-oak-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ab9e87" />
      <stop offset="25%" stop-color="#e8dfcc" />
      <stop offset="50%" stop-color="#f7f3e8" />
      <stop offset="75%" stop-color="#e8dfcc" />
      <stop offset="100%" stop-color="#6e6350" />
    </linearGradient>

    <linearGradient id="white-oak-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6e6350" />
      <stop offset="25%" stop-color="#e8dfcc" />
      <stop offset="50%" stop-color="#f7f3e8" />
      <stop offset="75%" stop-color="#e8dfcc" />
      <stop offset="100%" stop-color="#ab9e87" />
    </linearGradient>

    <linearGradient id="white-oak-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ab9e87" />
      <stop offset="25%" stop-color="#e8dfcc" />
      <stop offset="50%" stop-color="#f7f3e8" />
      <stop offset="75%" stop-color="#e8dfcc" />
      <stop offset="100%" stop-color="#6e6350" />
    </linearGradient>

    <linearGradient id="white-oak-right" x1="0%" y1="0%" x2="100%" y2="0%">
