<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">

  <!-- TRANSPARENT BACKGROUND -->
  <rect x="0" y="0" width="1200" height="700" fill="none"/>

  <!-- WHITE OAK RAILS (LIGHT WOOD) -->
  <defs>
    <linearGradient id="oakRail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#e8dfcc"/>
      <stop offset="50%" stop-color="#d8c9a8"/>
      <stop offset="100%" stop-color="#c2b49a"/>
    </linearGradient>
  </defs>

  <!-- Outer rail band -->
  <rect x="40" y="40" width="1120" height="620" rx="20" ry="20" fill="url(#oakRail)"/>

  <!-- BEACH BLOND CUSHIONS -->
  <defs>
    <linearGradient id="blondCushion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#f6ebd4"/>
      <stop offset="100%" stop-color="#e3d2b4"/>
    </linearGradient>
  </defs>

  <!-- Top cushion -->
  <rect x="100" y="80" width="1000" height="24" fill="url(#blondCushion)"/>
  <!-- Bottom cushion -->
  <rect x="100" y="596" width="1000" height="24" fill="url(#blondCushion)"/>
  <!-- Left cushion -->
  <rect x="80" y="100" width="24" height="500" fill="url(#blondCushion)"/>
  <!-- Right cushion -->
  <rect x="1096" y="100" width="24" height="500" fill="url(#blondCushion)"/>

  <!-- POCKET HOLES (CUTOUT POSITIONS, CENTER STAYS TRANSPARENT) -->
  <circle cx="100" cy="100" r="30" fill="none" stroke="none"/>
  <circle cx="1100" cy="100" r="30" fill="none" stroke="none"/>
  <circle cx="100" cy="600" r="30" fill="none" stroke="none"/>
  <circle cx="1100" cy="600" r="30" fill="none" stroke="none"/>
  <circle cx="600" cy="100" r="30" fill="none" stroke="none"/>
  <circle cx="600" cy="600" r="30" fill="none" stroke="none"/>

  <!-- RED RUBY DIAMONDS (BRUNSWICK FRACTIONAL SPACING) -->
  <g fill="#c00020" stroke="#4b0713" stroke-width="1.5">

    <!-- Top long rail (1/4, 1/2, 3/4) -->
    <rect x="350" y="54" width="12" height="12" transform="rotate(45 356 60)"/>
    <rect x="600" y="54" width="12" height="12" transform="rotate(45 606 60)"/>
    <rect x="850" y="54" width="12" height="12" transform="rotate(45 856 60)"/>

    <!-- Bottom long rail -->
    <rect x="350" y="614" width="12" height="12" transform="rotate(45 356 620)"/>
    <rect x="600" y="614" width="12" height="12" transform="rotate(45 606 620)"/>
    <rect x="850" y="614" width="12" height="12" transform="rotate(45 856 620)"/>

    <!-- Left short rail (1/3, 1/2, 2/3) -->
    <rect x="54" y="260" width="12" height="12" transform="rotate(45 60 266)"/>
    <rect x="54" y="350" width="12" height="12" transform="rotate(45 60 356)"/>
    <rect x="54" y="440" width="12" height="12" transform="rotate(45 60 446)"/>

    <!-- Right short rail -->
    <rect x="1134" y="260" width="12" height="12" transform="rotate(45 1140 266)"/>
    <rect x="1134" y="350" width="12" height="12" transform="rotate(45 1140 356)"/>
    <rect x="1134" y="440" width="12" height="12" transform="rotate(45 1140 446)"/>

  </g>

</svg>
