<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="700"
     viewBox="0 0 1200 700"
     role="img"
     aria-label="Modern brushed titanium billiard table rail overlay">

  <defs>
    <!-- Sleek Brushed Gunmetal / Titanium Rail Material -->
    <linearGradient id="metalBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A5056"/>
      <stop offset="0.3" stop-color="#34383D"/>
      <stop offset="0.7" stop-color="#222528"/>
      <stop offset="1" stop-color="#151719"/>
    </linearGradient>

    <linearGradient id="metalEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2124"/>
      <stop offset="1" stop-color="#0A0B0C"/>
    </linearGradient>

    <!-- Matte Beach-Blond Cushion Material -->
    <linearGradient id="cushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2A87D"/>
      <stop offset="0.5" stop-color="#A68C60"/>
      <stop offset="1" stop-color="#6E583A"/>
    </linearGradient>

    <!-- High-Definition Faceted Ruby Diamond Material -->
    <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5C5C"/>
      <stop offset="0.3" stop-color="#CC1122"/>
      <stop offset="0.7" stop-color="#880011"/>
      <stop offset="1" stop-color="#440005"/>
    </linearGradient>

    <!-- Subtle Accent Light Glow under Cushions -->
    <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Crisp cushion shadow -->
    <filter id="cushionInset" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow
        dx="0"
        dy="3"
        stdDeviation="2"
        flood-color="#050608"
        flood-opacity="0.9"/>
    </filter>

    <!-- Ruby diamond drop shadow -->
    <filter id="rubyInset" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow
        dx="0"
        dy="1"
        stdDeviation="0.75"
        flood-color="#110000"
        flood-opacity="0.95"/>
    </filter>

    <!-- Main transparency mask -->
    <mask id="tableCutouts"
          maskUnits="userSpaceOnUse"
          x="0"
          y="0"
          width="1200"
          height="700">
      <rect width="1200" height="700" fill="white"/>

      <!-- Fully transparent playfield -->
      <rect x="145" y="130" width="910" height="440" rx="8" fill="black"/>

      <!-- Six real transparent pocket openings (Flush side pockets) -->
      <circle cx="145" cy="130" r="43" fill="black"/>
      <circle cx="600" cy="130" r="34" fill="black"/>
      <circle cx="1055" cy="130" r="43" fill="black"/>

      <circle cx="145" cy="570" r="43" fill="black"/>
      <circle cx="600" cy="570" r="34" fill="black"/>
      <circle cx="1055" cy="570" r="43" fill="black"/>
    </mask>

    <!-- Keeps the centers of pocket depth rings transparent -->
    <mask id="pocketCenter"
          maskUnits="userSpaceOnUse"
          x="0"
          y="0"
          width="1200"
          height="700">
      <rect width="1200" height="700" fill="white"/>

      <circle cx="145" cy="130" r="33" fill="black"/>
      <circle cx="600" cy="130" r="26" fill="black"/>
      <circle cx="1055" cy="130" r="33" fill="black"/>

      <circle cx="145" cy="570" r="33" fill="black"/>
      <circle cx="600" cy="570" r="26" fill="black"/>
      <circle cx="1055" cy="570" r="33" fill="black"/>
    </mask>

    <!-- Reusable inset ruby diamond -->
    <g id="diamond">
      <rect
        x="-7"
        y="-7"
        width="14"
        height="14"
        rx="1.5"
        fill="#151719"
        stroke="#5A626A"
        stroke-width="0.75"
        transform="rotate(45)"/>
      <rect
        x="-5"
        y="-5"
        width="10"
        height="10"
        rx="0.8"
        fill="url(#ruby)"
        transform="rotate(45)"
        filter="url(#rubyInset)"/>
      <path
        d="M -2 -2 L 2 -2 L 0 2 Z"
        fill="#FFFFFF"
        opacity="0.65"
        transform="rotate(45)"/>
    </g>
  </defs>

  <!-- Outer brushed titanium rail assembly -->
  <g id="outer-rail" mask="url(#tableCutouts)">
    <!-- Dark lower/outer bevel -->
    <rect
      x="40"
      y="40"
      width="1120"
      height="620"
      rx="45"
      fill="url(#metalEdge)"/>

    <!-- Main brushed metal top surface -->
    <rect
      x="49"
      y="49"
      width="1102"
      height="602"
      rx="38"
      fill="url(#metalBase)"/>

    <!-- Outer metallic highlight line -->
    <rect
      x="57"
      y="57"
      width="1086"
      height="586"
      rx="32"
      fill="none"
      stroke="#8C96A0"
      stroke-width="2"
      opacity="0.6"/>

    <!-- Inner depth groove -->
    <rect
      x="68"
      y="68"
      width="1064"
      height="564"
      rx="25"
      fill="none"
      stroke="#111315"
      stroke-width="8"
      opacity="0.8"/>

    <!-- Inner metallic highlight line -->
    <rect
      x="74"
      y="74"
      width="1052"
      height="552"
      rx="20"
      fill="none"
      stroke="#6E7882"
      stroke-width="1.5"
      opacity="0.5"/>
  </g>

  <!-- Signature Under-Cushion Accent Light Strip -->
  <g id="accent-light" mask="url(#tableCutouts)" stroke="#AEEFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" filter="url(#accentGlow)">
    <line x1="155" y1="126" x2="560" y2="126"/>
    <line x1="640" y1="126" x2="1045" y2="126"/>
    <line x1="155" y1="574" x2="560" y2="574"/>
    <line x1="640" y1="574" x2="1045" y2="574"/>
    <line x1="126" y1="155" x2="126" y2="545"/>
    <line x1="1074" y1="155" x2="1074" y2="545"/>
  </g>

  <!-- Cushion assembly -->
  <g id="cushion-inset"
     mask="url(#tableCutouts)"
     filter="url(#cushionInset)">
    <!-- Dark cushion bed / shadow seam -->
    <rect
      x="118"
      y="104"
      width="964"
      height="492"
      rx="16"
      fill="none"
      stroke="#1F1A14"
      stroke-width="28"/>

    <!-- Matte beach-blond rubber -->
    <rect
      x="133"
      y="119"
      width="934"
      height="462"
      rx="10"
      fill="none"
      stroke="url(#cushion)"
      stroke-width="18"/>

    <!-- Subtle inner cushion edge -->
    <rect
      x="144"
      y="130"
      width="912"
      height="440"
      rx="8"
      fill="none"
      stroke="#D2B88C"
      stroke-width="1.5"
      opacity="0.5"/>
  </g>

  <!-- Pocket depth rings -->
  <g id="pocket-bevels" mask="url(#pocketCenter)" fill="none">
    <!-- Top-left -->
    <circle cx="145" cy="130" r="42" stroke="#6E7882" stroke-width="5"/>
    <circle cx="145" cy="130" r="35" stroke="#111315" stroke-width="6"/>

    <!-- Top-middle -->
    <circle cx="600" cy="130" r="33" stroke="#6E7882" stroke-width="5"/>
    <circle cx="600" cy="130" r="27" stroke="#111315" stroke-width="6"/>

    <!-- Top-right -->
    <circle cx="1055" cy="130" r="42" stroke="#6E7882" stroke-width="5"/>
    <circle cx="1055" cy="130" r="35" stroke="#111315" stroke-width="6"/>

    <!-- Bottom-left -->
    <circle cx="145" cy="570" r="42" stroke="#6E7882" stroke-width="5"/>
    <circle cx="145" cy="570" r="35" stroke="#111315" stroke-width="6"/>

    <!-- Bottom-middle -->
    <circle cx="600" cy="570" r="33" stroke="#6E7882" stroke-width="5"/>
    <circle cx="600" cy="570" r="27" stroke="#111315" stroke-width="6"/>

    <!-- Bottom-right -->
    <circle cx="1055" cy="570" r="42" stroke="#6E7882" stroke-width="5"/>
    <circle cx="1055" cy="570" r="35" stroke="#111315" stroke-width="6"/>
  </g>

  <!-- Exactly 18 WPA-compliant ruby sight diamonds -->
  <g id="diamond-sights">
    <!-- Top rail: 6 diamonds -->
    <use href="#diamond" x="258.75" y="86"/>
    <use href="#diamond" x="372.50" y="86"/>
    <use href="#diamond" x="486.25" y="86"/>
    <use href="#diamond" x="713.75" y="86"/>
    <use href="#diamond" x="827.50" y="86"/>
    <use href="#diamond" x="941.25" y="86"/>

    <!-- Bottom rail: 6 diamonds -->
    <use href="#diamond" x="258.75" y="614"/>
    <use href="#diamond" x="372.50" y="614"/>
    <use href="#diamond" x="486.25" y="614"/>
    <use href="#diamond" x="713.75" y="614"/>
    <use href="#diamond" x="827.50" y="614"/>
    <use href="#diamond" x="941.25" y="614"/>

    <!-- Left rail: 3 diamonds -->
    <use href="#diamond" x="86" y="240"/>
    <use href="#diamond" x="86" y="350"/>
    <use href="#diamond" x="86" y="460"/>

    <!-- Right rail: 3 diamonds -->
    <use href="#diamond" x="1114" y="240"/>
    <use href="#diamond" x="1114" y="350"/>
    <use href="#diamond" x="1114" y="460"/>
  </g>
</svg>
