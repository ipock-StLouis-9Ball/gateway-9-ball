<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <!-- White Oak Wood Grain -->
    <pattern id="whiteOak" patternUnits="userSpaceOnUse" width="200" height="60">
      <rect width="200" height="60" fill="#F2E8D6"/>
      <path d="M0,12 Q50,4 100,13 T200,9" stroke="#E2D3B9" stroke-width="2.5" fill="none" opacity="0.85"/>
      <path d="M0,28 Q60,21 120,30 T200,26" stroke="#D9C9AD" stroke-width="1.8" fill="none" opacity="0.75"/>
      <path d="M0,45 Q40,37 90,46 T200,42" stroke="#E2D3B9" stroke-width="2.2" fill="none" opacity="0.8"/>
    </pattern>

    <!-- Polished Gold for Corner Castings -->
    <linearGradient id="polishedGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2d777" />
      <stop offset="25%" stop-color="#fff5b5" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="75%" stop-color="#fff5b5" />
      <stop offset="100%" stop-color="#aa8529" />
    </linearGradient>

    <!-- Polished Silver for Side Castings -->
    <linearGradient id="polishedSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9d9d9" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#999999" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#737373" />
    </linearGradient>

    <!-- Ruby Gem for Diamond Sights -->
    <radialGradient id="rubyGem" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff6666" />
      <stop offset="40%" stop-color="#e60000" />
      <stop offset="80%" stop-color="#990000" />
      <stop offset="100%" stop-color="#4d0000" />
    </radialGradient>

    <!-- Master Diamond Template -->
    <g id="diamond" fill="url(#rubyGem)" stroke="#3b1116" stroke-width="0.8">
      <path d="M 0,-6 L 4,0 L 0,6 L -4,0 Z" />
    </g>

    <!-- Visual Filters (Degrade gracefully on simple mobile viewers) -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
    </filter>
    <filter id="cushionShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- LAYER 1: WOOD RAIL (NO MASKS USED)         -->
  <!-- ========================================== -->
  <!-- fill-rule="evenodd" mathematically cuts the transparent center and circular pocket 
       bites directly out of the wood path, guaranteeing it works in every viewer. -->
  <path fill="url(#whiteOak)" fill-rule="evenodd" stroke="#D6C6AA" stroke-width="1.5" d="
    M 20,0 L 980,0 A 20,20 0 0 1 1000,20 L 1000,480 A 20,20 0 0 1 980,500 L 20,500 A 20,20 0 0 1 0,480 L 0,20 A 20,20 0 0 1 20,0 Z
    M 95,60 L 465,60 A 35,35 0 0 0 535,60 L 905,60 A 35,35 0 0 0 940,95 L 940,405 A 35,35 0 0 0 905,440 L 535,440 A 35,35 0 0 0 465,440 L 95,440 A 35,35 0 0 0 60,405 L 60,95 A 35,35 0 0 0 95,60 Z
  "/>

  <!-- ========================================== -->
  <!-- LAYER 2: METAL CASTINGS & POCKET CUTOUTS   -->
  <!-- ========================================== -->
  <!-- These castings lay directly over the wood cutouts, forming the perfect metal jaws -->
  <g stroke="#555555" stroke-width="1.5">
    <!-- GOLD CORNERS -->
    <g fill="url(#polishedGold)">
      <!-- Top Left -->
      <path d="M 110,0 L 20,0 A 20,20 0 0 0 0,20 L 0,110 L 60,110 L 60,95 A 35,35 0 0 1 95,60 L 110,60 Z" />
      <!-- Top Right -->
      <path d="M 890,0 L 980,0 A 20,20 0 0 1 1000,20 L 1000,110 L 940,110 L 940,95 A 35,35 0 0 1 905,60 L 890,60 Z" />
      <!-- Bottom Left -->
      <path d="M 110,500 L 20,500 A 20,20 0 0 1 0,480 L 0,390 L 60,390 L 60,405 A 35,35 0 0 1 95,440 L 110,440 Z" />
      <!-- Bottom Right -->
      <path d="M 890,500 L 980,500 A 20,20 0 0 0 1000,480 L 1000,390 L 940,390 L 940,405 A 35,35 0 0 1 905,440 L 890,440 Z" />
    </g>
    <!-- SILVER SIDE POCKETS -->
    <g fill="url(#polishedSilver)">
      <!-- Top Side -->
      <path d="M 430,0 L 570,0 L 570,60 L 535,60 A 35,35 0 0,1 465,60 L 430,60 Z" />
      <!-- Bottom Side -->
      <path d="M 430,500 L 570,500 L 570,440 L 535,440 A 35,35 0 0,0 465,440 L 430,440 Z" />
    </g>
  </g>

  <!-- ========================================== -->
  <!-- LAYER 3: NEON GLOW (Mobile Safe Fallback)  -->
  <!-- ========================================== -->
  <!-- Stacked opacity lines guarantee a smooth glow even if GitHub strips the blur filter -->
  <g stroke="#E30022" stroke-linecap="round">
    <!-- Wide, faint outer glow (Uses actual blur filter if supported) -->
    <g stroke-width="16" opacity="0.3" filter="url(#neonGlow)">
      <line x1="110" y1="80" x2="455" y2="80" /> <line x1="545" y1="80" x2="890" y2="80" />
      <line x1="110" y1="420" x2="455" y2="420" /> <line x1="545" y1="420" x2="890" y2="420" />
      <line x1="80" y1="110" x2="80" y2="390" /> <line x1="920" y1="110" x2="920" y2="390" />
    </g>
    <!-- Medium inner glow (Ensures red light bleeds nicely on basic viewers) -->
    <g stroke-width="8" opacity="0.6">
      <line x1="110" y1="80" x2="455" y2="80" /> <line x1="545" y1="80" x2="890" y2="80" />
      <line x1="110" y1="420" x2="455" y2="420" /> <line x1="545" y1="420" x2="890" y2="420" />
      <line x1="80" y1="110" x2="80" y2="390" /> <line x1="920" y1="110" x2="920" y2="390" />
    </g>
  </g>

  <!-- ========================================== -->
  <!-- LAYER 4: K-66 CUSHIONS (Blond Sand)        -->
  <!-- ========================================== -->
  <!-- The sharp, angled polygon jaws. The rubber covers the neon glow, forcing light down onto the felt -->
  <g fill="#E8D5B5" filter="url(#cushionShadow)">
    <polygon points="95,60 465,60 450,85 120,85" />
    <polygon points="535,60 905,60 880,85 550,85" />
    <polygon points="95,440 465,440 450,415 120,415" />
    <polygon points="535,440 905,440 880,415 550,415" />
    <polygon points="60,95 60,405 85,380 85,120" />
    <polygon points="940,95 940,405 915,380 915,120" />
  </g>

  <!-- ========================================== -->
  <!-- LAYER 5: RUBY DIAMOND SIGHTS               -->
  <!-- ========================================== -->
  <g>
    <!-- Top Rail -->
    <use href="#diamond" x="190" y="30" /> <use href="#diamond" x="270" y="30" /> <use href="#diamond" x="350" y="30" />
    <use href="#diamond" x="650" y="30" /> <use href="#diamond" x="730" y="30" /> <use href="#diamond" x="810" y="30" />
    <!-- Bottom Rail -->
    <use href="#diamond" x="190" y="470" /> <use href="#diamond" x="270" y="470" /> <use href="#diamond" x="350" y="470" />
    <use href="#diamond" x="650" y="470" /> <use href="#diamond" x="730" y="470" /> <use href="#diamond" x="810" y="470" />
    <!-- Left Rail -->
    <use href="#diamond" x="30" y="165" transform="rotate(90 30 165)" />
    <use href="#diamond" x="30" y="250" transform="rotate(90 30 250)" />
    <use href="#diamond" x="30" y="335" transform="rotate(90 30 335)" />
    <!-- Right Rail -->
    <use href="#diamond" x="970" y="165" transform="rotate(90 970 165)" />
    <use href="#diamond" x="970" y="250" transform="rotate(90 970 250)" />
    <use href="#diamond" x="970" y="335" transform="rotate(90 970 335)" />
  </g>
</svg>
