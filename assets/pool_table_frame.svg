<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">

  <!-- TRANSPARENT BACKGROUND -->
  <rect x="0" y="0" width="1200" height="700" fill="none"/>

  <!-- METAL OUTER FRAME -->
  <rect x="20" y="20" width="1160" height="660" rx="24" ry="24" fill="#3f3f3f"/>
  <rect x="40" y="40" width="1120" height="620" rx="20" ry="20" fill="#606060"/>

  <!-- BUMPER CUSHIONS (NO FELT) -->
  <!-- Top cushion -->
  <rect x="100" y="80" width="1000" height="24" fill="#1b1b1b"/>
  <!-- Bottom cushion -->
  <rect x="100" y="596" width="1000" height="24" fill="#1b1b1b"/>
  <!-- Left cushion -->
  <rect x="80" y="100" width="24" height="500" fill="#1b1b1b"/>
  <!-- Right cushion -->
  <rect x="1096" y="100" width="24" height="500" fill="#1b1b1b"/>

  <!-- POCKET CUTOUTS (TRANSPARENT HOLES) -->
  <!-- Corners -->
  <circle cx="100" cy="100" r="30" fill="none"/>
  <circle cx="1100" cy="100" r="30" fill="none"/>
  <circle cx="100" cy="600" r="30" fill="none"/>
  <circle cx="1100" cy="600" r="30" fill="none"/>
  <!-- Sides -->
  <circle cx="600" cy="100" r="30" fill="none"/>
  <circle cx="600" cy="600" r="30" fill="none"/>

  <!-- CARDINALS‑RED DIAMONDS (FRACTIONAL GRID) -->
  <!-- Long rails: inner span x = 140..1060 (920 wide), diamonds at 1/8..7/8 -->
  <g fill="#ff2b3b" stroke="#4b0713" stroke-width="1.5">
    <!-- Top rail diamonds (y = 60) -->
    <rect x="249" y="54" width="12" height="12" transform="rotate(45 255 60)"/>
    <rect x="364" y="54" width="12" height="12" transform="rotate(45 370 60)"/>
    <rect x="479" y="54" width="12" height="12" transform="rotate(45 485 60)"/>
    <rect x="594" y="54" width="12" height="12" transform="rotate(45 600 60)"/>
    <rect x="709" y="54" width="12" height="12" transform="rotate(45 715 60)"/>
    <rect x="824" y="54" width="12" height="12" transform="rotate(45 830 60)"/>
    <rect x="939" y="54" width="12" height="12" transform="rotate(45 945 60)"/>

    <!-- Bottom rail diamonds (y = 620) -->
    <rect x="249" y="614" width="12" height="12" transform="rotate(45 255 620)"/>
    <rect x="364" y="614" width="12" height="12" transform="rotate(45 370 620)"/>
    <rect x="479" y="614" width="12" height="12" transform="rotate(45 485 620)"/>
    <rect x="594" y="614" width="12" height="12" transform="rotate(45 600 620)"/>
    <rect x="709" y="614" width="12" height="12" transform="rotate(45 715 620)"/>
    <rect x="824" y="614" width="12" height="12" transform="rotate(45 830 620)"/>
    <rect x="939" y="614" width="12" height="12" transform="rotate(45 945 620)"/>

    <!-- Short rails: inner span y = 140..560 (420 wide), diamonds at 1/4, 2/4, 3/4 -->
    <!-- Left rail diamonds (x = 60) -->
    <rect x="54" y="239" width="12" height="12" transform="rotate(45 60 245)"/>
    <rect x="54" y="349" width="12" height="12" transform="rotate(45 60 355)"/>
    <rect x="54" y="459" width="12" height="12" transform="rotate(45 60 465)"/>

    <!-- Right rail diamonds (x = 1140) -->
    <rect x="1134" y="239" width="12" height="12" transform="rotate(45 1140 245)"/>
    <rect x="1134" y="349" width="12" height="12" transform="rotate(45 1140 355)"/>
    <rect x="1134" y="459" width="12" height="12" transform="rotate(45 1140 465)"/>
  </g>

</svg>
