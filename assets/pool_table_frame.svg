<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="700"
     viewBox="0 0 1200 700"
     role="img"
     aria-label="Modern transparent metallic billiard table rail overlay">

  <defs>
    <!-- Brushed Titanium Rail Material (Matches 1839.jpg) -->
    <linearGradient id="oakBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D0D5DB"/>
      <stop offset="0.48" stop-color="#9BA4B5"/>
      <stop offset="1" stop-color="#5C6675"/>
    </linearGradient>

    <linearGradient id="oakEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A414C"/>
      <stop offset="0.5" stop-color="#1A1E24"/>
      <stop offset="1" stop-color="#0F1115"/>
    </linearGradient>

    <!-- Matte beach-blond cushion material (Matches 1839.jpg) -->
    <linearGradient id="cushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8D5B5"/>
      <stop offset="0.6" stop-color="#D4BB94"/>
      <stop offset="1" stop-color="#B39566"/>
    </linearGradient>

    <!-- Recessed ruby diamond material -->
    <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5C5C"/>
      <stop offset="0.35" stop-color="#D91122"/>
      <stop offset="1" stop-color="#7A000D"/>
    </linearGradient>

    <!-- Horizontal grain (Opacity lowered later for brushed metal effect) -->
    <filter id="oakGrain" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.012 0.42"
        numOctaves="2"
        seed="18"
        result="noise"/>
      <feColorMatrix
        in="noise"
        type="matrix"
        values="
          0.36 0    0    0 0.23
          0    0.25 0    0 0.14
          0    0    0.13 0 0.05
          0    0    0    0.24 0"/>
    </filter>

    <!-- Vertical grain -->
    <filter id="oakGrainVertical" x="-10%" y="-5%" width="120%" height="110%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.42 0.012"
        numOctaves="2"
        seed="27"
        result="noise"/>
      <feColorMatrix
        in="noise"
        type="matrix"
        values="
          0.36 0    0    0 0.23
          0    0.25 0    0 0.14
          0    0    0.13 0 0.05
          0    0    0    0.24 0"/>
    </filter>

    <!-- Narrow cushion shadow -->
    <filter id="cushionInset" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow
        dx="0"
        dy="3"
        stdDeviation="2"
        flood-color="#05080A"
        flood-opacity="0.85"/>
    </filter>

    <!-- Tiny recess shadow for ruby diamonds -->
    <filter id="rubyInset" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow
        dx="0"
        dy="1"
        stdDeviation="0.55"
        flood-color="#110000"
        flood-opacity="0.95"/>
    </filter>

    <!--
      Main transparency mask:
      - Side pockets (cy=115 and cy=585) pulled back to sit flush inside the metal rails.
    -->
    <mask id="tableCutouts"
          maskUnits="userSpaceOnUse"
          x="0"
          y="0"
          width="1200"
          height="700">
      <rect width="1200" height="700" fill="white"/>

      <!-- Fully transparent playfield -->
      <rect x="145" y="130" width="910" height="440" rx="8" fill="black"/>

      <!-- Pocket Openings -->
      <circle cx="145" cy="130" r="43" fill="black"/>
      <circle cx="600" cy="115" r="36" fill="black"/>
      <circle cx="1055" cy="130" r="43" fill="black"/>

      <circle cx="145" cy="570" r="43" fill="black"/>
      <circle cx="600" cy="585" r="36" fill="black"/>
      <circle cx="1055" cy="570" r="43" fill="black"/>
    </mask>

    <!-- Keeps the centers of pocket depth rings transparent -->
    <mask id="pocketCenter"
          maskUnits="userSpaceOnUse"
          x="0"
          y="0"
          width="1200"
          height="700">
      <rect width="1200" height="700" fill="white"/>

      <circle cx="145" cy="130" r="33" fill="black"/>
      <circle cx="600" cy="115" r="28" fill="black"/>
      <circle cx="1055" cy="130" r="33" fill="black"/>

      <circle cx="145" cy="570" r="33" fill="black"/>
      <circle cx="600" cy="585" r="28" fill="black"/>
      <circle cx="1055" cy="570" r="33" fill="black"/>
    </mask>

    <!-- Grain clips -->
    <clipPath id="topBottomClip">
      <path
        fill-rule="evenodd"
        d="
          M 85 58 H 1115 V 142 H 85 Z
          M 85 558 H 1115 V 642 H 85 Z
        "/>
    </clipPath>

    <clipPath id="sideClip">
      <path
        fill-rule="evenodd"
        d="
          M 58 85 H 142 V 615 H 58 Z
          M 1058 85 H 1142 V 615 H 1058 Z
        "/>
    </clipPath>

    <!-- Reusable inset ruby diamond -->
    <g id="diamond">
      <!-- Dark routed recess -->
      <rect
        x="-7"
        y="-7"
        width="14"
        height="14"
        rx="1.2"
        fill="#111317"
        stroke="#444B55"
        stroke-width="0.5"
        transform="rotate(45)"/>

      <!-- Ruby insert -->
      <rect
        x="-5"
        y="-5"
        width="10"
        height="10"
        rx="0.7"
        fill="url(#ruby)"
        transform="rotate(45)"
        filter="url(#rubyInset)"/>

      <!-- Diamond glint -->
      <path
        d="M 0 -4 L 3 0 L 0 -1 L -3 0 Z"
        fill="#FFFFFF"
        opacity="0.6"
        transform="rotate(45)"/>
    </g>
  </defs>

  <!-- Outer brushed titanium rail assembly -->
  <g id="outer-rail" mask="url(#tableCutouts)">
    <rect
      x="40"
      y="40"
      width="1120"
      height="620"
      rx="45"
      fill="url(#oakEdge)"/>

    <rect
      x="49"
      y="49"
      width="1102"
      height="602"
      rx="38"
      fill="url(#oakBase)"/>

    <!-- Outer metallic highlight -->
    <rect
      x="57"
      y="57"
      width="1086"
      height="586"
      rx="32"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2"
      opacity="0.50"/>

    <!-- Inner deep metal groove -->
    <rect
      x="68"
      y="68"
      width="1064"
      height="564"
      rx="25"
      fill="none"
      stroke="#111317"
      stroke-width="8"
      opacity="0.80"/>

    <!-- Inner silver bevel highlight -->
    <rect
      x="74"
      y="74"
      width="1052"
      height="552"
      rx="20"
      fill="none"
      stroke="#A8B2C1"
      stroke-width="2"
      opacity="0.70"/>
  </g>

  <!-- Faint brushing texture (Opacity lowered to 0.08 for metal effect) -->
  <g id="metal-grain" mask="url(#tableCutouts)" opacity="0.08">
    <g clip-path="url(#topBottomClip)">
      <rect
        x="55"
        y="54"
        width="1090"
        height="105"
        fill="#111317"
        filter="url(#oakGrain)"/>

      <rect
        x="55"
        y="541"
        width="1090"
        height="105"
        fill="#111317"
        filter="url(#oakGrain)"/>
    </g>

    <g clip-path="url(#sideClip)">
      <rect
        x="54"
        y="55"
        width="105"
        height="590"
        fill="#111317"
        filter="url(#oakGrainVertical)"/>

      <rect
        x="1041"
        y="55"
        width="105"
        height="590"
        fill="#111317"
        filter="url(#oakGrainVertical)"/>
    </g>
  </g>

  <!-- Cushion and LED Accent Assembly -->
  <g id="cushion-inset"
     mask="url(#tableCutouts)"
     filter="url(#cushionInset)">

    <!-- Dark shadow seam -->
    <rect
      x="118"
      y="104"
      width="964"
      height="492"
      rx="16"
      fill="none"
      stroke="#1F1A14"
      stroke-width="28"/>

    <!-- Matte sand cushion -->
    <rect
      x="133"
      y="119"
      width="934"
      height="462"
      rx="10"
      fill="none"
      stroke="url(#cushion)"
      stroke-width="18"/>

    <!-- GitHub Safe Blue LED Glow (Wide blurred stroke) -->
    <rect
      x="144"
      y="130"
      width="912"
      height="440"
      rx="8"
      fill="none"
      stroke="#00E5FF"
      stroke-width="8"
      opacity="0.30"/>

    <!-- Sharp Blue LED Core -->
    <rect
      x="144"
      y="130"
      width="912"
      height="440"
      rx="8"
      fill="none"
      stroke="#00E5FF"
      stroke-width="2"
      opacity="0.95"/>
  </g>

  <!-- Modern Dark Pocket Casings with Silver Rims -->
  <g id="pocket-bevels" mask="url(#pocketCenter)" fill="none">
    <!-- Top-left -->
    <circle cx="145" cy="130" r="42" stroke="#A8B2C1" stroke-width="3"/>
    <circle cx="145" cy="130" r="39" stroke="#111317" stroke-width="6"/>

    <!-- Top-middle -->
    <circle cx="600" cy="115" r="36" stroke="#A8B2C1" stroke-width="3"/>
    <circle cx="600" cy="115" r="33" stroke="#111317" stroke-width="6"/>

    <!-- Top-right -->
    <circle cx="1055" cy="130" r="42" stroke="#A8B2C1" stroke-width="3"/>
    <circle cx="1055" cy="130" r="39" stroke="#111317" stroke-width="6"/>

    <!-- Bottom-left -->
    <circle cx="145" cy="570" r="42" stroke="#A8B2C1" stroke-width="3"/>
    <circle cx="145" cy="570" r="39" stroke="#111317" stroke-width="6"/>

    <!-- Bottom-middle -->
    <circle cx="600" cy="585" r="36" stroke="#A8B2C1" stroke-width="3"/>
    <circle cx="600" cy="585" r="33" stroke="#111317" stroke-width="6"/>

    <!-- Bottom-right -->
    <circle cx="1055" cy="570" r="42" stroke="#A8B2C1" stroke-width="3"/>
    <circle cx="1055" cy="570" r="39" stroke="#111317" stroke-width="6"/>
  </g>

  <!-- Exactly 18 ruby sights placed to WPA mathematical standards -->
  <g id="diamond-sights">
    <!-- Top rail: 6 diamonds -->
    <use href="#diamond" x="258.75" y="86"/>
    <use href="#diamond" x="372.50" y="86"/>
    <use href="#diamond" x="486.25" y="86"/>
    <use href="#diamond" x="713.75" y="86"/>
    <use href="#diamond" x="827.50" y="86"/>
    <use href="#diamond" x="941.25" y="86"/>

    <!-- Bottom rail: 6 diamonds -->
    <use href="#diamond" x="258.75" y="614"/>
    <use href="#diamond" x="372.50" y="614"/>
    <use href="#diamond" x="486.25" y="614"/>
    <use href="#diamond" x="713.75" y="614"/>
    <use href="#diamond" x="827.50" y="614"/>
    <use href="#diamond" x="941.25" y="614"/>

    <!-- Left rail: 3 diamonds -->
    <use href="#diamond" x="86" y="240"/>
    <use href="#diamond" x="86" y="350"/>
    <use href="#diamond" x="86" y="460"/>

    <!-- Right rail: 3 diamonds -->
    <use href="#diamond" x="1114" y="240"/>
    <use href="#diamond" x="1114" y="350"/>
    <use href="#diamond" x="1114" y="460"/>
  </g>
</svg>
