<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Playing Surface / Table Geometry Scale: 10 units = 1 inch -->
    <!-- Playfield: 1000 x 500 (100" x 50") -->
    <!-- Footprint: 1140 x 640 (114" x 64") -->
    
    <!-- White Oak Wood Gradients (Mitered 4-way grain) -->
    <linearGradient id="oak-top" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="0" y2="100">
      <stop offset="0%" stop-color="#bdae97"/>
      <stop offset="15%" stop-color="#e8decc"/>
      <stop offset="50%" stop-color="#d4c5af"/>
      <stop offset="85%" stop-color="#c6b69e"/>
      <stop offset="100%" stop-color="#9e8f7a"/>
    </linearGradient>

    <linearGradient id="oak-bottom" gradientUnits="userSpaceOnUse" x1="0" y1="670" x2="0" y2="600">
      <stop offset="0%" stop-color="#bdae97"/>
      <stop offset="15%" stop-color="#e8decc"/>
      <stop offset="50%" stop-color="#d4c5af"/>
      <stop offset="85%" stop-color="#c6b69e"/>
      <stop offset="100%" stop-color="#9e8f7a"/>
    </linearGradient>

    <linearGradient id="oak-left" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="100" y2="0">
      <stop offset="0%" stop-color="#bdae97"/>
      <stop offset="15%" stop-color="#e8decc"/>
      <stop offset="50%" stop-color="#d4c5af"/>
      <stop offset="85%" stop-color="#c6b69e"/>
      <stop offset="100%" stop-color="#9e8f7a"/>
    </linearGradient>

    <linearGradient id="oak-right" gradientUnits="userSpaceOnUse" x1="1170" y1="0" x2="1100" y2="0">
      <stop offset="0%" stop-color="#bdae97"/>
      <stop offset="15%" stop-color="#e8decc"/>
      <stop offset="50%" stop-color="#d4c5af"/>
      <stop offset="85%" stop-color="#c6b69e"/>
      <stop offset="100%" stop-color="#9e8f7a"/>
    </linearGradient>

    <!-- ========================================== -->
    <!-- ADDED: Heavy White Oak Procedural Texture  -->
    <!-- Does not alter original table geometry.    -->
    <!-- ========================================== -->

    <!-- Long horizontal wood grain: top and bottom rails -->
    <filter id="oak-grain-horizontal"
            x="-10%" y="-30%" width="120%" height="160%"
            color-interpolation-filters="sRGB">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.008 0.15"
        numOctaves="3"
        seed="29"
        stitchTiles="stitch"
        result="long-grain"/>

      <feColorMatrix
        in="long-grain"
        type="matrix"
        values="
          0.23 0    0    0  0.17
          0    0.12 0    0  0.07
          0    0    0.05 0  0.02
          0    0    0    0.52 0"
        result="brown-grain"/>

      <feBlend
        in="SourceGraphic"
        in2="brown-grain"
        mode="multiply"
        result="oak-grain-result"/>
    </filter>

    <!-- Long vertical wood grain: left and right end rails -->
    <filter id="oak-grain-vertical"
            x="-30%" y="-10%" width="160%" height="120%"
            color-interpolation-filters="sRGB">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.15 0.008"
        numOctaves="3"
        seed="41"
        stitchTiles="stitch"
        result="long-grain"/>

      <feColorMatrix
        in="long-grain"
        type="matrix"
        values="
          0.23 0    0    0  0.17
          0    0.12 0    0  0.07
          0    0    0.05 0  0.02
          0    0    0    0.52 0"
        result="brown-grain"/>

      <feBlend
        in="SourceGraphic"
        in2="brown-grain"
        mode="multiply"
        result="oak-grain-result"/>
    </filter>

    <!-- Clear oil/varnish finish over horizontal rails -->
    <linearGradient id="oak-clearcoat-horizontal"
                    gradientUnits="userSpaceOnUse"
                    x1="0" y1="30" x2="0" y2="100">
      <stop offset="0%" stop-color="#fff7df" stop-opacity="0.30"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="52%" stop-color="#6c4930" stop-opacity="0.08"/>
      <stop offset="82%" stop-color="#ffecc1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2f1d10" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Clear oil/varnish finish over vertical rails -->
    <linearGradient id="oak-clearcoat-vertical"
                    gradientUnits="userSpaceOnUse"
                    x1="30" y1="0" x2="100" y2="0">
      <stop offset="0%" stop-color="#fff7df" stop-opacity="0.30"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="52%" stop-color="#6c4930" stop-opacity="0.08"/>
      <stop offset="82%" stop-color="#ffecc1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2f1d10" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Polished 24k Gold Gradient (Corner Bezels) -->
    <linearGradient id="gold-24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a6104"/>
      <stop offset="25%" stop-color="#ffcc00"/>
      <stop offset="45%" stop-color="#fff4b3"/>
      <stop offset="65%" stop-color="#d4af37"/>
      <stop offset="90%" stop-color="#f8e076"/>
      <stop offset="100%" stop-color="#5c4000"/>
    </linearGradient>

    <!-- Polished Silver Gradient (Side Bezels) -->
    <linearGradient id="silver-polished" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5054"/>
      <stop offset="20%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#8c97a3"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#a4b0be"/>
      <stop offset="100%" stop-color="#2d3339"/>
    </linearGradient>

    <!-- Ruby Gem Radial Gradient -->
    <radialGradient id="ruby-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="40%" stop-color="#d90022"/>
      <stop offset="80%" stop-color="#730012"/>
      <stop offset="100%" stop-color="#330008"/>
    </radialGradient>

    <!-- Neon Light Filters -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Wide bleeding red haze over the transparent playfield -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur3" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur3" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.8" />
    </filter>

    <!-- Ruby Pattern Def (Replaces Diamonds) -->
    <g id="ruby">
      <!-- 24k Gold Bezel Rim around the gem -->
      <polygon points="0,-7.5 7.5,0 0,7.5 -7.5,0" fill="#222" stroke="url(#gold-24k)" stroke-width="1.5" />
      <!-- Faceted Ruby Base -->
      <polygon points="0,-6.5 6.5,0 0,6.5 -6.5,0" fill="url(#ruby-grad)" />
      <!-- Inner Crown Facet -->
      <polygon points="0,-3.5 3.5,0 0,3.5 -3.5,0" fill="none" stroke="#ffcccc" stroke-width="0.5" opacity="0.6"/>
      <!-- Specular Highlight (The glint) -->
      <circle cx="-1.5" cy="-2.5" r="1" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Master Clip Path to enforce perfect playfield transparency & pocket cuts -->
    <clipPath id="frame-cutout">
      <path d="
        M 30,30 L 1170,30 L 1170,670 L 30,670 Z
        M 132,100
        L 575,100 L 583,82 A 22 22 0 0 1 617,82 L 625,100
        L 1068,100 L 1092,82 A 28 28 0 0 1 1118,108 L 1100,132
        L 1100,568 L 1118,592 A 28 28 0 0 1 1092,618 L 1068,600
        L 625,600 L 617,618 A 22 22 0 0 1 583,618 L 575,600
        L 132,600 L 108,618 A 28 28 0 0 1 82,592 L 100,568
        L 100,132 L 82,108 A 28 28 0 0 1 108,82 Z"
        clip-rule="evenodd" />
    </clipPath>
  </defs>

  <!-- ========================================== -->
  <!-- 1. POCKET DROPS (The deep caves)           -->
  <!-- ========================================== -->
  <g id="pocket-caves" fill="#050508" filter="url(#inner-shadow)">
    <!-- Corner Pockets (1"-2.25" shelf depth implied by circle offset) -->
    <circle cx="75" cy="75" r="32" />
    <circle cx="1125" cy="75" r="32" />
    <circle cx="75" cy="625" r="32" />
    <circle cx="1125" cy="625" r="32" />
    <!-- Side Pockets (Almost no shelf, centered closer to playfield) -->
    <circle cx="600" cy="70" r="34" />
    <circle cx="600" cy="630" r="34" />
  </g>

  <!-- ========================================== -->
  <!-- 2. WOOD FRAME (White Oak, Mitered Joints)  -->
  <!-- Original geometry retained.                -->
  <!-- Added texture overlays only.                -->
  <!-- ========================================== -->
  <g clip-path="url(#frame-cutout)">
    <!-- Top Rail -->
    <polygon points="0,0 1200,0 600,350 Z" fill="url(#oak-top)" />
    <polygon points="0,0 1200,0 600,350 Z"
             fill="url(#oak-top)"
             filter="url(#oak-grain-horizontal)"
             opacity="0.72" />
    <polygon points="0,0 1200,0 600,350 Z"
             fill="url(#oak-clearcoat-horizontal)"
             opacity="0.42" />

    <!-- Bottom Rail -->
    <polygon points="0,700 1200,700 600,350 Z" fill="url(#oak-bottom)" />
    <polygon points="0,700 1200,700 600,350 Z"
             fill="url(#oak-bottom)"
             filter="url(#oak-grain-horizontal)"
             opacity="0.72" />
    <polygon points="0,700 1200,700 600,350 Z"
             fill="url(#oak-clearcoat-horizontal)"
             opacity="0.42" />

    <!-- Left Rail -->
    <polygon points="0,0 0,700 600,350 Z" fill="url(#oak-left)" />
    <polygon points="0,0 0,700 600,350 Z"
             fill="url(#oak-left)"
             filter="url(#oak-grain-vertical)"
             opacity="0.72" />
    <polygon points="0,0 0,700 600,350 Z"
             fill="url(#oak-clearcoat-vertical)"
             opacity="0.42" />

    <!-- Right Rail -->
    <polygon points="1200,0 1200,700 600,350 Z" fill="url(#oak-right)" />
    <polygon points="1200,0 1200,700 600,350 Z"
             fill="url(#oak-right)"
             filter="url(#oak-grain-vertical)"
             opacity="0.72" />
    <polygon points="1200,0 1200,700 600,350 Z"
             fill="url(#oak-clearcoat-vertical)"
             opacity="0.42" />
  </g>

  <!-- ========================================== -->
  <!-- ADDED: visible cathedral grain figure      -->
  <!-- Sits on frame only; clipped from playfield. -->
  <!-- ========================================== -->
  <g clip-path="url(#frame-cutout)"
     fill="none"
     stroke-linecap="round"
     pointer-events="none">

    <!-- Top and bottom horizontal oak grain -->
    <g stroke="#5c3a21" stroke-width="2.2" opacity="0.24">
      <path d="M 135,52
               C 250,23 346,88 460,53
               S 670,19 785,53
               S 968,86 1082,48" />

      <path d="M 130,72
               C 260,39 365,102 483,70
               S 705,35 828,70
               S 1008,102 1136,68" />

      <path d="M 135,648
               C 250,677 346,612 460,647
               S 670,681 785,647
               S 968,614 1082,652" />

      <path d="M 130,628
               C 260,661 365,598 483,630
               S 705,665 828,630
               S 1008,598 1136,632" />
    </g>

    <!-- Left and right vertical oak grain -->
    <g stroke="#5c3a21" stroke-width="2.2" opacity="0.24">
      <path d="M 52,126
               C 22,218 88,287 51,382
               S 19,546 55,626" />

      <path d="M 73,105
               C 41,202 101,302 66,402
               S 37,548 72,649" />

      <path d="M 1148,126
               C 1178,218 1112,287 1149,382
               S 1181,546 1145,626" />

      <path d="M 1127,105
               C 1159,202 1099,302 1134,402
               S 1163,548 1128,649" />
    </g>

    <!-- White-oak medullary ray glints -->
    <g stroke="#fff0cb" stroke-width="1" opacity="0.20">
      <path d="M 155,41 L 360,41" />
      <path d="M 744,63 L 978,63" />
      <path d="M 220,659 L 430,659" />
      <path d="M 754,638 L 1015,638" />
      <path d="M 40,150 L 40,292" />
      <path d="M 61,409 L 61,548" />
      <path d="M 1160,150 L 1160,292" />
      <path d="M 1139,409 L 1139,548" />
    </g>
  </g>

  <!-- Cushion Backdraft lip (Simulating K-55 12-15 degree slant to slate) -->
  <path d="M 132,100 L 575,100 L 583,82 A 22 22 0 0 1 617,82 L 625,100
           L 1068,100 L 1092,82 A 28 28 0 0 1 1118,108 L 1100,132
           L 1100,568 L 1118,592 A 28 28 0 0 1 1092,618 L 1068,600
           L 625,600 L 617,618 A 22 22 0 0 1 583,618 L 575,600
           L 132,600 L 108,618 A 28 28 0 0 1 82,592 L 100,568
           L 100,132 L 82,108 A 28 28 0 0 1 108,82 Z"
        fill="none" stroke="#605442" stroke-width="1.5" />

  <!-- ========================================== -->
  <!-- 3. NEON RED LIGHTING (Underneath Cushions) -->
  <!-- ========================================== -->
  <g id="neon-glow-layer">
    <!-- Base Red Haze -->
    <g stroke="#ff0022" stroke-width="4.5" stroke-linecap="round" filter="url(#neon-glow)">
      <path d="M 135,100 L 572,100" /> <!-- Top Left -->
      <path d="M 628,100 L 1065,100" /> <!-- Top Right -->
      <path d="M 135,600 L 572,600" /> <!-- Bottom Left -->
      <path d="M 628,600 L 1065,600" /> <!-- Bottom Right -->
      <path d="M 100,135 L 100,565" /> <!-- Left -->
      <path d="M 1100,135 L 1100,565" /> <!-- Right -->
    </g>

    <!-- Hot Core Lines -->
    <g stroke="#ffb3bc" stroke-width="1.5" stroke-linecap="round" opacity="0.95">
      <path d="M 135,100 L 572,100" /> 
      <path d="M 628,100 L 1065,100" /> 
      <path d="M 135,600 L 572,600" /> 
      <path d="M 628,600 L 1065,600" /> 
      <path d="M 100,135 L 100,565" /> 
      <path d="M 1100,135 L 1100,565" /> 
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 4. RUBY INLAYS (18 total, exactly 12.5" spacing, 3" back) -->
  <!-- ========================================== -->
  <!-- Track coords: Top/Bottom Y = 70 & 630. Left/Right X = 70 & 1130 -->
  <g id="ruby-inlays">
    <!-- Top Rail -->
    <use href="#ruby" x="225" y="70" />
    <use href="#ruby" x="350" y="70" />
    <use href="#ruby" x="475" y="70" />
    <use href="#ruby" x="725" y="70" />
    <use href="#ruby" x="850" y="70" />
    <use href="#ruby" x="975" y="70" />

    <!-- Bottom Rail -->
    <use href="#ruby" x="225" y="630" />
    <use href="#ruby" x="350" y="630" />
    <use href="#ruby" x="475" y="630" />
    <use href="#ruby" x="725" y="630" />
    <use href="#ruby" x="850" y="630" />
    <use href="#ruby" x="975" y="630" />

    <!-- Left Rail -->
    <use href="#ruby" x="70" y="225" />
    <use href="#ruby" x="70" y="350" />
    <use href="#ruby" x="70" y="475" />

    <!-- Right Rail -->
    <use href="#ruby" x="1130" y="225" />
    <use href="#ruby" x="1130" y="350" />
    <use href="#ruby" x="1130" y="475" />
  </g>

  <!-- ========================================== -->
  <!-- 5. METAL BEZELS (Hugging outer frame, leaving holes open) -->
  <!-- ========================================== -->

  <!-- 24K GOLD Corner Bezels -->
  <g id="gold-corners" fill="url(#gold-24k)" stroke="#594400" stroke-width="1.5">
    <!-- Top-Left Gold Corner -->
    <path d="M 20,120 L 20,50 A 30 30 0 0 1 50,20 L 120,20 L 120,40 A 50 50 0 0 0 40,120 Z" />
    <path d="M 23,115 L 23,55 A 25 25 0 0 1 55,23 L 115,23" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>

    <!-- Top-Right Gold Corner -->
    <path d="M 1180,120 L 1180,50 A 30 30 0 0 0 1150,20 L 1080,20 L 1080,40 A 50 50 0 0 1 1160,120 Z" />
    <path d="M 1177,115 L 1177,55 A 25 25 0 0 0 1145,23 L 1085,23" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>

    <!-- Bottom-Left Gold Corner -->
    <path d="M 20,580 L 20,650 A 30 30 0 0 0 50,680 L 120,680 L 120,660 A 50 50 0 0 1 40,580 Z" />
    <path d="M 23,585 L 23,645 A 25 25 0 0 0 55,677 L 115,677" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>

    <!-- Bottom-Right Gold Corner -->
    <path d="M 1180,580 L 1180,650 A 30 30 0 0 1 1150,680 L 1080,680 L 1080,660 A 50 50 0 0 0 1160,580 Z" />
    <path d="M 1177,585 L 1177,645 A 25 25 0 0 1 1145,677 L 1085,677" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- POLISHED SILVER Side Bezels -->
  <g id="silver-sides" fill="url(#silver-polished)" stroke="#1a1c1f" stroke-width="1.5">
    <!-- Top-Center Silver Bezel -->
    <!-- Hugs the rail width, arches U-shape perfectly around the pocket hole -->
    <path d="M 530,20 L 670,20 L 670,40 L 638,40 A 38 38 0 0 0 562,40 L 530,40 Z" />
    <path d="M 533,23 L 667,23" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

    <!-- Bottom-Center Silver Bezel -->
    <path d="M 530,680 L 670,680 L 670,660 L 638,660 A 38 38 0 0 1 562,660 L 530,660 Z" />
    <path d="M 533,677 L 667,677" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
