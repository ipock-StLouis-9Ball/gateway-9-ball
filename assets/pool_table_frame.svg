<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- White Oak Wood Gradients -->
    <linearGradient id="oak-horiz" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9d8f76" />   <!-- Outer bevel shadow -->
      <stop offset="8%" stop-color="#e8e0d1" />   <!-- Soft oak highlight -->
      <stop offset="40%" stop-color="#e6d9bf" />  <!-- Warm golden heartwood -->
      <stop offset="75%" stop-color="#d5c7ad" />  <!-- Medium straw/tan -->
      <stop offset="92%" stop-color="#b6a890" />  <!-- Inner shadow -->
      <stop offset="100%" stop-color="#736651" /> <!-- Joint shadow -->
    </linearGradient>

    <linearGradient id="oak-vert" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d8f76" />
      <stop offset="8%" stop-color="#e8e0d1" />
      <stop offset="40%" stop-color="#e6d9bf" />
      <stop offset="75%" stop-color="#d5c7ad" />
      <stop offset="92%" stop-color="#b6a890" />
      <stop offset="100%" stop-color="#736651" />
    </linearGradient>

    <!-- Metallic 24k Gold Bezel Gradient (Corner Pockets) -->
    <linearGradient id="gold-24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#805b00" />   <!-- Deep shadow -->
      <stop offset="18%" stop-color="#ffd700" />  <!-- Bright gold -->
      <stop offset="35%" stop-color="#fff8db" />  <!-- Mirror highlight -->
      <stop offset="55%" stop-color="#daa520" />  <!-- Warm goldenrod -->
      <stop offset="80%" stop-color="#fdf2b5" />  <!-- Light reflection -->
      <stop offset="100%" stop-color="#543c00" /> <!-- Core shadow -->
    </linearGradient>

    <!-- Metallic Polished Silver Bezel Gradient (Middle Pockets) -->
    <linearGradient id="polished-silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#40474e" />   <!-- Shadow -->
      <stop offset="20%" stop-color="#ffffff" />  <!-- Intense sheen -->
      <stop offset="45%" stop-color="#a0abb7" />  <!-- Brushed metal midtone -->
      <stop offset="75%" stop-color="#f1f5f9" />  <!-- Sky reflection -->
      <stop offset="90%" stop-color="#647280" />  <!-- Lowlight -->
      <stop offset="100%" stop-color="#2c3036" /> <!-- Dark edge falloff -->
    </linearGradient>

    <!-- Red Ruby-Gem Radial Face Gradient -->
    <radialGradient id="ruby-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff7d7d" />  <!-- Crown reflection -->
      <stop offset="40%" stop-color="#e60000" />  <!-- Vibrant body red -->
      <stop offset="80%" stop-color="#930000" />  <!-- Pavilion shadow -->
      <stop offset="100%" stop-color="#400000" /> <!-- Girdle boundary -->
    </radialGradient>

    <!-- Red Neon Glow Filter -->
    <filter id="red-neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur3" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur3" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Faceted Ruby Gem Pattern -->
    <g id="ruby-gem">
      <!-- Outer Base Cut -->
      <polygon points="0,-10 7,-3 4,5 -4,5 -7,-3" fill="url(#ruby-grad)" stroke="#300000" stroke-width="0.75" />
      <!-- Simulated Facet Highlights -->
      <polygon points="0,-10 0,0 7,-3" fill="#ffffff" opacity="0.25" />
      <polygon points="0,-10 0,0 -7,-3" fill="#800000" opacity="0.35" />
      <polygon points="7,-3 0,0 4,5" fill="#ff4d4d" opacity="0.2" />
      <polygon points="-7,-3 0,0 -4,5" fill="#330000" opacity="0.4" />
      <!-- Star / Specular Reflection Spot -->
      <circle cx="-1.8" cy="-3.5" r="1.3" fill="#ffffff" opacity="0.95" />
    </g>
  </defs>

  <!-- ================= WOOD RAILS (WHITE OAK) ================= -->
  <g id="wooden-rails">
    <!-- Top-Left Rail Segment -->
    <rect x="190" y="120" width="560" height="60" rx="4" fill="url(#oak-horiz)" stroke="#92826a" stroke-width="1" />
    <!-- Top-Right Rail Segment -->
    <rect x="850" y="120" width="560" height="60" rx="4" fill="url(#oak-horiz)" stroke="#92826a" stroke-width="1" />
    <!-- Bottom-Left Rail Segment -->
    <rect x="190" y="720" width="560" height="60" rx="4" fill="url(#oak-horiz)" stroke="#92826a" stroke-width="1" />
    <!-- Bottom-Right Rail Segment -->
    <rect x="850" y="720" width="560" height="60" rx="4" fill="url(#oak-horiz)" stroke="#92826a" stroke-width="1" />
    <!-- Left Rail Segment -->
    <rect x="120" y="190" width="60" height="520" rx="4" fill="url(#oak-vert)" stroke="#92826a" stroke-width="1" />
    <!-- Right Rail Segment -->
    <rect x="1420" y="190" width="60" height="520" rx="4" fill="url(#oak-vert)" stroke="#92826a" stroke-width="1" />
    
    <!-- Chrome Inset Strips framing the wood rails -->
    <rect x="180" y="116" width="1240" height="4" fill="#cbd5e1" opacity="0.3" />
    <rect x="180" y="780" width="1240" height="4" fill="#cbd5e1" opacity="0.3" />
  </g>

  <!-- ================= RUBY GEMSTONE INLAYS (18 TOTAL) ================= -->
  <g id="ruby-inlays">
    <!-- Left Rail Inlays -->
    <use href="#ruby-gem" x="150" y="320" />
    <use href="#ruby-gem" x="150" y="450" />
    <use href="#ruby-gem" x="150" y="580" />

    <!-- Right Rail Inlays -->
    <use href="#ruby-gem" x="1450" y="320" />
    <use href="#ruby-gem" x="1450" y="450" />
    <use href="#ruby-gem" x="1450" y="580" />

    <!-- Top Left Rail Inlays -->
    <use href="#ruby-gem" x="325" y="150" />
    <use href="#ruby-gem" x="470" y="150" />
    <use href="#ruby-gem" x="615" y="150" />

    <!-- Top Right Rail Inlays -->
    <use href="#ruby-gem" x="985" y="150" />
    <use href="#ruby-gem" x="1130" y="150" />
    <use href="#ruby-gem" x="1275" y="150" />

    <!-- Bottom Left Rail Inlays -->
    <use href="#ruby-gem" x="325" y="750" />
    <use href="#ruby-gem" x="470" y="750" />
    <use href="#ruby-gem" x="615" y="750" />

    <!-- Bottom Right Rail Inlays -->
    <use href="#ruby-gem" x="985" y="750" />
    <use href="#ruby-gem" x="1130" y="750" />
    <use href="#ruby-gem" x="1275" y="750" />
  </g>

  <!-- ================= NEON RED CUSHIONS & UNDERGLOW ================= -->
  <g id="neon-cushions">
    <!-- Top-Left Inner Cushion -->
    <path d="M 195,178 L 745,178" stroke="#4a0404" stroke-width="8" stroke-linecap="round" />
    <path d="M 195,178 L 745,178" stroke="#ff1e42" stroke-width="3" stroke-linecap="round" filter="url(#red-neon-glow)" />
    <path d="M 195,178 L 745,178" stroke="#ffffff" stroke-width="0.75" stroke-linecap="round" opacity="0.9" />

    <!-- Top-Right Inner Cushion -->
    <path d="M 855,178 L 1405,178" stroke="#4a0404" stroke-width="8" stroke-linecap="round" />
    <path d="M 855,178 L 1405,178" stroke="#ff1e42" stroke-width="3" stroke-linecap="round" filter="url(#red-neon-glow)" />
    <path d="M 855,178 L 1405,178" stroke="#ffffff" stroke-width="0.75" stroke-linecap="round" opacity="0.9" />

    <!-- Bottom-Left Inner Cushion -->
    <path d="M 195,722 L 745,722" stroke="#4a0404" stroke-width="8" stroke-linecap="round" />
    <path d="M 195,722 L 745,722" stroke="#ff1e42" stroke-width="3" stroke-linecap="round" filter="url(#red-neon-glow)" />
    <path d="M 195,722 L 745,722" stroke="#ffffff" stroke-width="0.75" stroke-linecap="round" opacity="0.9" />

    <!-- Bottom-Right Inner Cushion -->
    <path d="M 855,722 L 1405,722" stroke="#4a0404" stroke-width="8" stroke-linecap="round" />
    <path d="M 855,722 L 1405,722" stroke="#ff1e42" stroke-width="3" stroke-linecap="round" filter="url(#red-neon-glow)" />
    <path d="M 855,722 L 1405,722" stroke="#ffffff" stroke-width="0.75" stroke-linecap="round" opacity="0.9" />

    <!-- Left Inner Cushion -->
    <path d="M 178,195 L 178,705" stroke="#4a0404" stroke-width="8" stroke-linecap="round" />
    <path d="M 178,195 L 178,705" stroke="#ff1e42" stroke-width="3" stroke-linecap="round" filter="url(#red-neon-glow)" />
    <path d="M 178,195 L 178,705" stroke="#ffffff" stroke-width="0.75" stroke-linecap="round" opacity="0.9" />

    <!-- Right Inner Cushion -->
    <path d="M 1422,195 L 1422,705" stroke="#4a0404" stroke-width="8" stroke-linecap="round" />
    <path d="M 1422,195 L 1422,705" stroke="#ff1e42" stroke-width="3" stroke-linecap="round" filter="url(#red-neon-glow)" />
    <path d="M 1422,195 L 1422,705" stroke="#ffffff" stroke-width="0.75" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- ================= POCKETS & METAL BEZELS ================= -->
  <g id="pocket-hardware">
    <!-- POCKET HOLES (Completely dark deep chambers) -->
    <!-- Corner Holes -->
    <circle cx="140" cy="140" r="24" fill="#040406" />
    <circle cx="1460" cy="140" r="24" fill="#040406" />
    <circle cx="140" cy="760" r="24" fill="#040406" />
    <circle cx="1460" cy="760" r="24" fill="#040406" />
    <!-- Side Holes -->
    <circle cx="800" cy="125" r="26" fill="#040406" />
    <circle cx="800" cy="775" r="26" fill="#040406" />

    <!-- 4 CORNERS: POLISHED GOLD-24K BEZELS -->
    <!-- Top-Left Corner -->
    <path d="M 120,195 L 120,145 C 120,131 131,120 145,120 L 195,120 C 195,120 185,142 155,155 C 125,168 120,195 120,195 Z" 
          fill="url(#gold-24k)" stroke="#594400" stroke-width="1.25" />
    <path d="M 124,185 C 126,165 142,142 165,130 C 160,136 150,146 146,156 C 142,166 137,175 132,185 Z" 
          fill="#fff" opacity="0.25" /> <!-- Soft highlights -->

    <!-- Top-Right Corner -->
    <path d="M 1480,195 L 1480,145 C 1480,131 1469,120 1455,120 L 1405,120 C 1405,120 1415,142 1445,155 C 1475,168 1480,195 1480,195 Z" 
          fill="url(#gold-24k)" stroke="#594400" stroke-width="1.25" />
    <path d="M 1476,185 C 1474,165 1458,142 1435,130 C 1440,136 1450,146 1454,156 C 1458,166 1463,175 1468,185 Z" 
          fill="#fff" opacity="0.25" />

    <!-- Bottom-Left Corner -->
    <path d="M 120,705 L 120,755 C 120,769 131,780 145,780 L 195,780 C 195,780 185,758 155,745 C 125,732 120,705 120,705 Z" 
          fill="url(#gold-24k)" stroke="#594400" stroke-width="1.25" />
    <path d="M 124,715 C 126,735 142,758 165,770 C 160,764 150,754 146,744 C 142,734 137,725 132,715 Z" 
          fill="#fff" opacity="0.25" />

    <!-- Bottom-Right Corner -->
    <path d="M 1480,705 L 1480,755 C 1480,769 1469,780 1455,780 L 1405,780 C 1405,780 1415,758 1445,745 C 1475,732 1480,705 1480,705 Z" 
          fill="url(#gold-24k)" stroke="#594400" stroke-width="1.25" />
    <path d="M 1476,715 C 1474,735 1458,758 1435,770 C 1440,764 1450,754 1454,744 C 1458,734 1463,725 1468,715 Z" 
          fill="#fff" opacity="0.25" />


    <!-- 2 SIDES: POLISHED SILVER BEZELS -->
    <!-- Top-Center Side Pocket -->
    <path d="M 755,120 L 845,120 L 845,135 C 845,135 833,165 800,165 C 767,165 755,135 755,135 Z" 
          fill="url(#polished-silver)" stroke="#2b2f35" stroke-width="1.25" />
    <!-- Specular highlight cutouts inside metallic curvature -->
    <path d="M 760,123 L 840,123 L 835,133 C 830,135 815,150 800,150 C 785,150 770,135 765,133 Z" 
          fill="#ffffff" opacity="0.15" />

    <!-- Bottom-Center Side Pocket -->
    <path d="M 755,780 L 845,780 L 845,765 C 845,765 833,735 800,735 C 767,735 755,765 755,765 Z" 
          fill="url(#polished-silver)" stroke="#2b2f35" stroke-width="1.25" />
    <path d="M 760,777 L 840,777 L 835,767 C 830,765 815,750 800,750 C 785,750 770,765 765,767 Z" 
          fill="#ffffff" opacity="0.15" />
  </g>
</svg>
