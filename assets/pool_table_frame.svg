  <path d="M 3080 2640 L 3200 2700 L 3320 2640" stroke="#1f0a0d" stroke-width="24" fill="none"/>

  <!-- Layer 7: Heavy Polished Brass Corner Elbows over Outer Corner Transitions -->
  <!-- Top-Left Brass Corner Elbow -->
