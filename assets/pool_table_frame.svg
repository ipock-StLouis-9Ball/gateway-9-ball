<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="700"
     viewBox="0 0 1200 700">

  <defs>

    <!-- =========================================================
         MODERN WHITE-OAK MATERIAL
         Soft, contemporary beach-blond oak:
         long linear pores, restrained contrast, satin-matte look.
         ========================================================= -->

    <linearGradient id="oak-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e7c8"/>
      <stop offset="24%" stop-color="#ead3a6"/>
      <stop offset="56%" stop-color="#d6b77b"/>
      <stop offset="100%" stop-color="#ac7b42"/>
    </linearGradient>

    <linearGradient id="oak-outer-bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c99a57"/>
      <stop offset="48%" stop-color="#8c5f32"/>
      <stop offset="100%" stop-color="#5b391f"/>
    </linearGradient>

    <linearGradient id="oak-inner-bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1cf"/>
      <stop offset="50%" stop-color="#efd7a3"/>
      <stop offset="100%" stop-color="#c18e4e"/>
    </linearGradient>

    <!-- Matte beach-blond cushion: subtle depth, no shiny plastic -->
    <linearGradient id="cushion-rubber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a96f"/>
      <stop offset="48%" stop-color="#ab8c54"/>
      <stop offset="100%" stop-color="#795b37"/>
    </linearGradient>

    <!-- Restrained inset ruby: no neon and no outer glow -->
    <linearGradient id="ruby-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a7b"/>
      <stop offset="28%" stop-color="#d43b3c"/>
      <stop offset="66%" stop-color="#94181d"/>
      <stop offset="100%" stop-color="#4b080d"/>
    </linearGradient>

    <!-- Horizontal modern grain for head/foot rails -->
    <filter id="grain-horizontal"
            x="-5%"
            y="-20%"
            width="110%"
            height="140%">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.008 0.23"
                    numOctaves="2"
                    seed="21"
                    result="grain"/>
      <feColorMatrix in="grain"
                     type="matrix"
                     values="
                       0.36 0    0    0 0.25
                       0    0.25 0    0 0.16
                       0    0    0.14 0 0.08
                       0    0    0    0.23 0"/>
    </filter>

    <!-- Vertical modern grain for side rails -->
    <filter id="grain-vertical"
            x="-20%"
            y="-5%"
            width="140%"
            height="110%">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.23 0.008"
                    numOctaves="2"
                    seed="44"
                    result="grain"/>
      <feColorMatrix in="grain"
                     type="matrix"
                     values="
                       0.36 0    0    0 0.25
                       0    0.25 0    0 0.16
                       0    0    0.14 0 0.08
                       0    0    0    0.23 0"/>
    </filter>

    <!-- Soft wood pore texture, deliberately subtle -->
    <filter id="fine-pore"
            x="-5%"
            y="-5%"
            width="110%"
            height="110%">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.10 0.10"
                    numOctaves="2"
                    seed="9"
                    result="pores"/>
      <feColorMatrix in="pores"
                     type="matrix"
                     values="
                       0.30 0    0    0 0.24
                       0    0.19 0    0 0.13
                       0    0    0.08 0 0.06
                       0    0    0    0.08 0"/>
    </filter>

    <!-- Dark inset seam under rubber cushion -->
    <filter id="cushion-seam-shadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%">
      <feDropShadow dx="0"
                    dy="3"
                    stdDeviation="1.5"
                    flood-color="#3c2614"
                    flood-opacity="0.86"/>
    </filter>

    <!-- Ruby sits down inside the routed diamond recess -->
    <filter id="ruby-recess-shadow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feDropShadow dx="0"
                    dy="1.2"
                    stdDeviation="0.6"
                    flood-color="#2a150c"
                    flood-opacity="0.95"/>
    </filter>

    <!-- =========================================================
         TRANSPARENT PLAYING OPENING

         Black = transparent.
         White = visible frame.

         The center bed is transparent.
         Six pockets are not separate circles:
         each is a cut into the cushion/rail and connects to the bed.
         ========================================================= -->

    <mask id="frame-cutout-mask"
          maskUnits="userSpaceOnUse"
          x="0"
          y="0"
          width="1200"
          height="700">

      <!-- Default: show frame -->
      <rect x="0"
            y="0"
            width="1200"
            height="700"
            fill="white"/>

      <!-- Main transparent felt / slate opening -->
      <rect x="162"
            y="142"
            width="876"
            height="416"
            rx="2"
            fill="black"/>

      <!-- =====================================================
           CORNER POCKET CUTOUTS
           Each is connected to the transparent felt opening.
           ===================================================== -->

      <!-- Top-left corner pocket -->
      <path d="
        M 162 142
        L 223 142
        C 202 151 183 170 171 192
        C 165 176 162 159 162 142
        Z"
        fill="black"/>

      <!-- Top-right corner pocket -->
      <path d="
        M 1038 142
        L 977 142
        C 998 151 1017 170 1029 192
        C 1035 176 1038 159 1038 142
        Z"
        fill="black"/>

      <!-- Bottom-left corner pocket -->
      <path d="
        M 162 558
        L 223 558
        C 202 549 183 530 171 508
        C 165 524 162 541 162 558
        Z"
        fill="black"/>

      <!-- Bottom-right corner pocket -->
      <path d="
        M 1038 558
        L 977 558
        C 998 549 1017 530 1029 508
        C 1035 524 1038 541 1038 558
        Z"
        fill="black"/>

      <!-- =====================================================
           SIDE POCKET CUTOUTS

           Top pocket goes UP into top bumper + wood rail.
           Bottom pocket goes DOWN into bottom bumper + wood rail.

           Neither pocket extends farther into the felt bed.
           ===================================================== -->

      <!-- Top-middle side pocket -->
      <path d="
        M 554 142
        L 554 101
        C 566 88 581 82 600 82
        C 619 82 634 88 646 101
        L 646 142
        Z"
        fill="black"/>

      <!-- Bottom-middle side pocket -->
      <path d="
        M 554 558
        L 554 599
        C 566 612 581 618 600 618
        C 619 618 634 612 646 599
        L 646 558
        Z"
        fill="black"/>

    </mask>

    <!-- Clips grain to broad wood cap surfaces -->
    <clipPath id="top-bottom-rail-grain">
      <path d="
        M 62 58
        H 1138
        V 140
        H 62
        Z

        M 62 560
        H 1138
        V 642
        H 62
        Z"/>
    </clipPath>

    <clipPath id="left-right-rail-grain">
      <path d="
        M 58 62
        H 140
        V 638
        H 58
        Z

        M 1060 62
        H 1142
        V 638
        H 1060
        Z"/>
    </clipPath>

    <!-- Reusable ruby diamond: dark routed setting + ruby insert -->
    <g id="ruby-sight">
      <!-- Routed recess in wood -->
      <rect x="-9"
            y="-6"
            width="18"
            height="12"
            rx="1.3"
            fill="#4a2918"
            transform="rotate(45)"/>

      <!-- Dark inner setting ring -->
      <rect x="-7"
            y="-4.5"
            width="14"
            height="9"
            rx="1"
            fill="#6c1015"
            transform="rotate(45)"/>

      <!-- Red ruby face -->
      <rect x="-5.2"
            y="-3.3"
            width="10.4"
            height="6.6"
            rx="0.8"
            fill="url(#ruby-red)"
            transform="rotate(45)"
            filter="url(#ruby-recess-shadow)"/>

      <!-- Tiny muted facet highlight -->
      <path d="
        M -2.8 -1.4
        L 1.8 -1.4
        L 0 0.5
        Z"
        fill="#ffd2bd"
        opacity="0.30"
        transform="rotate(45)"/>
    </g>

  </defs>

  <!-- =========================================================
       FRAME ASSEMBLY
       Everything inside this group has the central bed and
       all six pocket mouths removed by the transparency mask.
       ========================================================= -->

  <g id="modern-white-oak-pool-table-frame"
     mask="url(#frame-cutout-mask)">

    <!-- Solid-wood thickness / dark outer routed edge -->
    <rect x="34"
          y="34"
          width="1132"
          height="632"
          rx="48"
          fill="url(#oak-outer-bevel)"/>

    <!-- Broad contemporary white-oak cap -->
    <rect x="47"
          y="47"
          width="1106"
          height="606"
          rx="39"
          fill="url(#oak-base)"/>

    <!-- Fine surface pore texture -->
    <rect x="47"
          y="47"
          width="1106"
          height="606"
          rx="39"
          fill="#6f461f"
          opacity="0.15"
          filter="url(#fine-pore)"/>

    <!-- Outside rounded bevel highlight -->
    <rect x="57"
          y="57"
          width="1086"
          height="586"
          rx="31"
          fill="none"
          stroke="#fff0ca"
          stroke-width="4"
          opacity="0.64"/>

    <!-- Broad routed shadow surrounding cushion area -->
    <rect x="78"
          y="78"
          width="1044"
          height="544"
          rx="24"
          fill="none"
          stroke="#805128"
          stroke-width="12"
          opacity="0.67"/>

    <!-- Inner oak bevel highlight -->
    <rect x="87"
          y="87"
          width="1026"
          height="526"
          rx="18"
          fill="none"
          stroke="url(#oak-inner-bevel)"
          stroke-width="4"
          opacity="0.82"/>

    <!-- Modern linear top and bottom oak grain -->
    <g clip-path="url(#top-bottom-rail-grain)"
       opacity="0.33">
      <rect x="56"
            y="54"
            width="1088"
            height="94"
            fill="#75481e"
            filter="url(#grain-horizontal)"/>

      <rect x="56"
            y="552"
            width="1088"
            height="94"
            fill="#75481e"
            filter="url(#grain-horizontal)"/>
    </g>

    <!-- Modern linear left and right oak grain -->
    <g clip-path="url(#left-right-rail-grain)"
       opacity="0.33">
      <rect x="54"
            y="56"
            width="94"
            height="588"
            fill="#75481e"
            filter="url(#grain-vertical)"/>

      <rect x="1052"
            y="56"
            width="94"
            height="588"
            fill="#75481e"
            filter="url(#grain-vertical)"/>
    </g>

    <!-- =======================================================
         RUBBER CUSHION SYSTEM

         Separate dark cushion bed, matte rubber, and lip.
         The transparency mask cuts this into six real pockets.
         ======================================================= -->

    <!-- Dark wood/rubber inset seam -->
    <rect x="121"
          y="103"
          width="958"
          height="494"
          rx="14"
          fill="none"
          stroke="#54351e"
          stroke-width="34"
          filter="url(#cushion-seam-shadow)"/>

    <!-- Main matte beach-blond cushion -->
    <rect x="137"
          y="119"
          width="926"
          height="462"
          rx="8"
          fill="none"
          stroke="url(#cushion-rubber)"
          stroke-width="19"/>

    <!-- Cushion nose highlight facing transparent felt opening -->
    <rect x="151"
          y="133"
          width="898"
          height="434"
          rx="3"
          fill="none"
          stroke="#ead3a0"
          stroke-width="3"
          opacity="0.58"/>

    <!-- =======================================================
         POCKET THROAT BEVELS
         These strokes sit around the transparent cutout edges.
         They create depth without filling the pocket centers.
         ======================================================= -->

    <!-- Top-left pocket -->
    <path d="
      M 162 142
      L 225 142
      C 202 153 183 172 171 195"
      fill="none"
      stroke="#442918"
      stroke-width="11"
      stroke-linecap="round"/>

    <path d="
      M 163 142
      L 217 142
      C 198 152 181 169 171 187"
      fill="none"
      stroke="#f4dda9"
      stroke-width="3"
      stroke-linecap="round"/>

    <!-- Top-right pocket -->
    <path d="
      M 1038 142
      L 975 142
      C 998 153 1017 172 1029 195"
      fill="none"
      stroke="#442918"
      stroke-width="11"
      stroke-linecap="round"/>

    <path d="
      M 1037 142
      L 983 142
      C 1002 152 1019 169 1029 187"
      fill="none"
      stroke="#f4dda9"
      stroke-width="3"
      stroke-linecap="round"/>

    <!-- Bottom-left pocket -->
    <path d="
      M 162 558
      L 225 558
      C 202 547 183 528 171 505"
      fill="none"
      stroke="#442918"
      stroke-width="11"
      stroke-linecap="round"/>

    <path d="
      M 163 558
      L 217 558
      C 198 548 181 531 171 513"
      fill="none"
      stroke="#f4dda9"
      stroke-width="3"
      stroke-linecap="round"/>

    <!-- Bottom-right pocket -->
    <path d="
      M 1038 558
      L 975 558
      C 998 547 1017 528 1029 505"
      fill="none"
      stroke="#442918"
      stroke-width="11"
      stroke-linecap="round"/>

    <path d="
      M 1037 558
      L 983 558
      C 1002 548 1019 531 1029 513"
      fill="none"
      stroke="#f4dda9"
      stroke-width="3"
      stroke-linecap="round"/>

    <!-- Top-middle side pocket:
         rises UP into cushion and rail, never down into felt -->
    <path d="
      M 554 142
      L 554 102
      C 566 88 582 81 600 81
      C 618 81 634 88 646 102
      L 646 142"
      fill="none"
      stroke="#442918"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <path d="
      M 559 142
      L 559 106
      C 570 96 583 91 600 91
      C 617 91 630 96 641 106
      L 641 142"
      fill="none"
      stroke="#f4dda9"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- Bottom-middle side pocket:
         drops DOWN into cushion and rail, never up into felt -->
    <path d="
      M 554 558
      L 554 598
      C 566 612 582 619 600 619
      C 618 619 634 612 646 598
      L 646 558"
      fill="none"
      stroke="#442918"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <path d="
      M 559 558
      L 559 594
      C 570 604 583 609 600 609
      C 617 609 630 604 641 594
      L 641 558"
      fill="none"
      stroke="#f4dda9"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"/>

  </g>

  <!-- =========================================================
       18 WPA-STYLE RAIL-CAP SIGHTS

       6 top + 6 bottom + 3 left + 3 right = 18 total.
       Long rails: eighth-style reference placement.
       Short rails: quarter-style reference placement.
       ========================================================= -->

  <g id="ruby-red-wpa-diamond-sights">

    <!-- Top long rail: six positions -->
    <use href="#ruby-sight" x="247.5" y="89"/>
    <use href="#ruby-sight" x="352.5" y="89"/>
    <use href="#ruby-sight" x="457.5" y="89"/>
    <use href="#ruby-sight" x="742.5" y="89"/>
    <use href="#ruby-sight" x="847.5" y="89"/>
    <use href="#ruby-sight" x="952.5" y="89"/>

    <!-- Bottom long rail: six positions -->
    <use href="#ruby-sight" x="247.5" y="611"/>
    <use href="#ruby-sight" x="352.5" y="611"/>
    <use href="#ruby-sight" x="457.5" y="611"/>
    <use href="#ruby-sight" x="742.5" y="611"/>
    <use href="#ruby-sight" x="847.5" y="611"/>
    <use href="#ruby-sight" x="952.5" y="611"/>

    <!-- Left short rail: three quarter reference positions -->
    <use href="#ruby-sight" x="89" y="246"/>
    <use href="#ruby-sight" x="89" y="350"/>
    <use href="#ruby-sight" x="89" y="454"/>

    <!-- Right short rail: three quarter reference positions -->
    <use href="#ruby-sight" x="1111" y="246"/>
    <use href="#ruby-sight" x="1111" y="350"/>
    <use href="#ruby-sight" x="1111" y="454"/>

  </g>

</svg>
