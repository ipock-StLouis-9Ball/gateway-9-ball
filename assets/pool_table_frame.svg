<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
    <defs>
        <linearGradient id="mahogany-top-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#120401" />
            <stop offset="20%" stop-color="#3d180a" />
            <stop offset="50%" stop-color="#662f18" />
            <stop offset="80%" stop-color="#3d180a" />
            <stop offset="100%" stop-color="#120401" />
        </linearGradient>

        <linearGradient id="mahogany-left-right" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#120401" />
            <stop offset="20%" stop-color="#3d180a" />
            <stop offset="50%" stop-color="#662f18" />
            <stop offset="80%" stop-color="#3d180a" />
            <stop offset="100%" stop-color="#120401" />
        </linearGradient>

        

        <filter id="neon-glow-filter" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur-wide" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur-med" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur-sharp" />
            <feComponentTransfer in="blur-wide" result="glow-boosted">
                <feFuncA type="linear" slope="2.0"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode in="glow-boosted" />
                <feMergeNode in="blur-med" />
                <feMergeNode in="blur-sharp" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <g id="diamond-sight">
            <polygon points="0,-7 5,0 0,7 -5,0" fill="#f0e2cc" stroke="#230d05" stroke-width="1.5" />
        </g>

        <mask id="playfield-cutout-mask">
            <rect x="0" y="0" width="1600" height="900" fill="#ffffff" />
            <path fill="#000000" d="
                M 210,180 
                L 760,180 
                A 45,45 0 0 1 840,180 
                L 1390,180 
                A 55,55 0 0 1 1420,210 
                L 1420,690 
                A 55,55 0 0 1 1390,720 
                L 840,720 
                A 45,45 0 0 1 760,720 
                L 210,720 
                A 55,55 0 0 1 180,690 
                L 180,210 
                A 55,55 0 0 1 210,180 Z" />
        </mask>
    </defs>

    <g mask="url(#playfield-cutout-mask)">
        <rect x="100" y="100" width="1400" height="700" rx="30" ry="30" fill="url(#mahogany-top-bottom)" />
        <path d="M 100,100 L 180,180 L 180,720 L 100,800 Z" fill="url(#mahogany-left-right)" />
        <path d="M 1500,100 L 1420,180 L 1420,720 L 1500,800 Z" fill="url(#mahogany-left-right)" />
    </g>

    <g stroke="#f73bfa" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#neon-glow-filter)">
        <line x1="220" y1="182" x2="755" y2="182" />
        <line x1="845" y1="182" x2="1380" y2="182" />
        <line x1="1418" y1="220" x2="1418" y2="680" />
        <line x1="845" y1="718" x2="1380" y2="718" />
        <line x1="220" y1="718" x2="755" y2="718" />
        <line x1="182" y1="220" x2="182" y2="680" />
    </g>

    
    <g>
        <use href="#diamond-sight" x="140" y="310" />
        <use href="#diamond-sight" x="140" y="450" />
        <use href="#diamond-sight" x="140" y="590" />
        <use href="#diamond-sight" x="1460" y="310" />
        <use href="#diamond-sight" x="1460" y="450" />
        <use href="#diamond-sight" x="1460" y="590" />
        <use href="#diamond-sight" x="335" y="140" />
        <use href="#diamond-sight" x="487" y="140" />
        <use href="#diamond-sight" x="640" y="140" />
        <use href="#diamond-sight" x="960" y="140" />
        <use href="#diamond-sight" x="1113" y="140" />
        <use href="#diamond-sight" x="1265" y="140" />
        <use href="#diamond-sight" x="335" y="760" />
        <use href="#diamond-sight" x="487" y="760" />
        <use href="#diamond-sight" x="640" y="760" />
        <use href="#diamond-sight" x="960" y="760" />
        <use href="#diamond-sight" x="1113" y="760" />
        <use href="#diamond-sight" x="1265" y="760" />
    </g>
</svg>

