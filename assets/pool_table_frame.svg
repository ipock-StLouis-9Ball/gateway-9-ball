    <!-- HIGH-SHINE POLISHED SILVER GRADIENT (Outer Plates & Rail Caps) -->
    <linearGradient id="polished-silver-bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#737e8c" />
