<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" height="100%">
  <defs>
    <!-- Background Panel Gradients -->
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3543" />
      <stop offset="50%" stop-color="#202934" />
      <stop offset="100%" stop-color="#141a22" />
    </linearGradient>

    <!-- Metallic Edge Border -->
    <linearGradient id="panel-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5a6e" />
      <stop offset="100%" stop-color="#1e2731" />
    </linearGradient>

    <!-- Deep Recess Gradients -->
    <linearGradient id="recess-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f1318" />
      <stop offset="50%" stop-color="#151b22" />
      <stop offset="100%" stop-color="#0f1318" />
    </linearGradient>

    <!-- Inner Shadow for Recesses -->
    <linearGradient id="inner-shadow-vert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0e12" stop-opacity="0.8"/>
      <stop offset="5%" stop-color="#0b0e12" stop-opacity="0"/>
      <stop offset="95%" stop-color="#0b0e12" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0e12" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Cue Stick Wood & Wrap Gradients -->
    <linearGradient id="cue-shaft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfbca2" />
      <stop offset="30%" stop-color="#fdf1dc" />
      <stop offset="70%" stop-color="#ebd8be" />
      <stop offset="100%" stop-color="#bba68d" />
    </linearGradient>

    <linearGradient id="cue-butt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#100b08" />
      <stop offset="25%" stop-color="#442a18" />
      <stop offset="60%" stop-color="#27170c" />
      <stop offset="100%" stop-color="#0d0805" />
    </linearGradient>

    <linearGradient id="cue-wrap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="40%" stop-color="#2a2a2a" />
      <stop offset="70%" stop-color="#1c1c1c" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>

    <!-- 3D Cue Ball Gradient -->
    <radialGradient id="cueball-shading" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="text-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .panel { stroke: url(#panel-border); stroke-width: 2; fill: url(#panel-bg); }
    .label-box { fill: #10141a; stroke: #2d3947; stroke-width: 1.5; }
    .neon-text { font-family: "Courier New", Courier, monospace, sans-serif; font-weight: bold; fill: #6bf1ff; filter: url(#text-glow); }
    .ui-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; fill: #94a7bd; letter-spacing: 1.5px; font-size: 11px; }
    .recess-well { fill: url(#recess-bg); stroke: #12181e; stroke-width: 2; }
    .avatar-icon { fill: #72849c; }
  </style>

  <!-- ================= LEFT PANEL: POWER METER & CUE ================= -->
  <g id="left-panel">
    <!-- Base Panel -->
    <rect x="20" y="25" width="160" height="750" rx="16" class="panel" />
    
    <!-- Recessed Slot for Cue -->
    <rect x="38" y="45" width="44" height="710" rx="22" class="recess-well" />
    <rect x="38" y="45" width="44" height="710" rx="22" fill="url(#inner-shadow-vert)" pointer-events="none" />

    <!-- Pool Cue Stick -->
    <g id="cue-stick" transform="translate(1, 0)">
      <!-- Tip -->
      <rect x="57" y="75" width="4" height="3" fill="#9ca3af" rx="0.5" />
      <rect x="57" y="78" width="4" height="10" fill="#ffffff" />
      <!-- Wooden Shaft -->
      <polygon points="57,88 61,88 62.5,440 55.5,440" fill="url(#cue-shaft)" />
      <!-- Joint -->
      <polygon points="55.5,440 62.5,440 63,452 55,452" fill="#111111" />
      <rect x="55.2" y="444" width="7.6" height="2.5" fill="#eab308" />
      <!-- Wrap -->
      <polygon points="55,452 63,452 64.8,640 53.2,640" fill="url(#cue-wrap)" />
      <!-- Butt Sleeve -->
      <polygon points="53.2,640 64.8,640 65.5,712 52.5,712" fill="url(#cue-butt)" />
      <!-- Decals/Inlays -->
      <polygon points="53.1,650 64.9,650 64,665 54,665" fill="#fef08a" opacity="0.15" />
      <polygon points="52.7,690 65.3,690 65.1,702 52.9,702" fill="#ffffff" opacity="0.8" />
      <!-- Bumper -->
      <rect x="54" y="712" width="10" height="8" rx="2" fill="#111111" />
    </g>

    <!-- Power Meter Track & Neon Labels -->
    <g id="power-scale" transform="translate(-4, 0)">
      <!-- Vertical Glowing Line -->
      <line x1="124" y1="110" x2="124" y2="710" stroke="#00d8f6" stroke-width="2.5" stroke-linecap="round" filter="url(#neon-glow)" />
      
      <!-- 25% -->
      <line x1="124" y1="110" x2="132" y2="110" stroke="#00d8f6" stroke-width="2.5" filter="url(#neon-glow)" />
      <text x="138" y="114" class="neon-text" font-size="12">25%</text>

      <!-- 50% -->
      <line x1="124" y1="260" x2="132" y2="260" stroke="#00d8f6" stroke-width="2.5" filter="url(#neon-glow)" />
      <text x="138" y="264" class="neon-text" font-size="12">50%</text>

      <!-- 75% -->
      <line x1="124" y1="410" x2="132" y2="410" stroke="#00d8f6" stroke-width="2.5" filter="url(#neon-glow)" />
      <text x="138" y="414" class="neon-text" font-size="12">75%</text>

      <!-- 75% (Duplicate matching the image layout) -->
      <line x1="124" y1="560" x2="132" y2="560" stroke="#00d8f6" stroke-width="2.5" filter="url(#neon-glow)" />
      <text x="138" y="564" class="neon-text" font-size="12">75%</text>

      <!-- 100% -->
      <line x1="124" y1="710" x2="132" y2="710" stroke="#00d8f6" stroke-width="2.5" filter="url(#neon-glow)" />
      <text x="138" y="714" class="neon-text" font-size="12">100%</text>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: PLAYERS, TIME & SPIN ================= -->
  <g id="right-panel">
    <!-- Base Panel -->
    <rect x="220" y="25" width="160" height="750" rx="16" class="panel" />

    <!-- ================= PLAYER 1 ================= -->
    <g id="player-1" transform="translate(0, 5)">
      <rect x="257" y="45" width="86" height="86" rx="10" class="recess-well" />
      <rect x="261" y="49" width="78" height="78" rx="8" fill="#1d2632" stroke="#2d3947" stroke-width="1" />
      
      <g transform="translate(265, 52)">
        <path d="M35,46 C35,36.5 43,35 50,35 C57,35 65,36.5 65,46 L65,54 L35,54 Z" class="avatar-icon" />
        <circle cx="50" cy="24" r="12" class="avatar-icon" />
      </g>

      <rect x="245" y="145" width="110" height="24" rx="5" class="label-box" />
      <text x="300" y="161" text-anchor="middle" class="ui-text">PLAYER 1</text>
    </g>

    <!-- ================= TIMER CIRCLE ================= -->
    <g id="timer" transform="translate(0, 10)">
      <circle cx="300" cy="335" r="58" class="recess-well" />
      <circle cx="300" cy="335" r="50" fill="#121820" />
      
      <!-- Faded Track -->
      <circle cx="300" cy="335" r="48" fill="none" stroke="#103e4d" stroke-width="4.5" />
      
      <!-- Active Neon Arc -->
      <circle cx="300" cy="335" r="48" fill="none" stroke="#00f3ff" stroke-width="4.5" 
              stroke-dasharray="226 301" stroke-dashoffset="0" stroke-linecap="round" filter="url(#neon-glow)" />

      <text x="300" y="345" text-anchor="middle" class="neon-text" font-size="28" letter-spacing="1">00:45</text>
    </g>

    <!-- ================= SPIN CONTROLLER ================= -->
    <g id="spin-controller" transform="translate(0, 12)">
      <circle cx="300" cy="495" r="58" class="recess-well" />
      <circle cx="300" cy="495" r="50" fill="#10151c" />

      <!-- Arrows -->
      <g fill="#4d5c6e">
        <polygon points="300,443 295,451 305,451" />
        <polygon points="300,547 295,539 305,539" />
        <polygon points="248,495 256,490 256,500" />
        <polygon points="352,495 344,490 344,500" />
      </g>

      <!-- Cue Ball -->
      <circle cx="300" cy="495" r="34" fill="url(#cueball-shading)" />
      <circle cx="300" cy="495" r="34" fill="none" stroke="#64748b" stroke-width="0.5" stroke-opacity="0.5" />

      <!-- Spin Contact Point -->
      <circle cx="300" cy="495" r="4" fill="#ef4444" />
      <circle cx="300" cy="495" r="1.5" fill="#fca5a5" opacity="0.8" />
    </g>

    <!-- ================= PLAYER 2 ================= -->
    <g id="player-2" transform="translate(0, 15)">
      <rect x="257" y="585" width="86" height="86" rx="10" class="recess-well" />
      <rect x="261" y="589" width="78" height="78" rx="8" fill="#1d2632" stroke="#2d3947" stroke-width="1" />
      
      <g transform="translate(265, 592)">
        <path d="M35,46 C35,36.5 43,35 50,35 C57,35 65,36.5 65,46 L65,54 L35,54 Z" class="avatar-icon" />
        <circle cx="50" cy="24" r="12" class="avatar-icon" />
      </g>

      <rect x="245" y="685" width="110" height="24" rx="5" class="label-box" />
      <text x="300" y="701" text-anchor="middle" class="ui-text">PLAYER 2</text>
    </g>
  </g>
</svg>
