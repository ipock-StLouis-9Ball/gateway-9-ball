<svg width="550" height="1050" viewBox="0 0 550 1050" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    WPA REGULATION-COMPLIANT POOL TABLE SCHEMATIC
    
    Dimensions are based on a standard 9-foot table (100" x 50" playing surface).
    The SVG is scaled to 1000px x 500px for the playing surface, with 25px rails.
    Total SVG canvas: 550px x 1050px.
    
    All colors are flat (no gradients or textures).
  -->

  <!-- Definitions for colors -->
  <defs>
    <style type="text/css">
      .felt { fill: #C19A6B; } /* Flat Tan Felt */
      .rail { fill: #8B4513; } /* Flat Brown Wood Color */
      .metal { fill: #B0B0B0; } /* Flat Gray Metal */
      .pocket { fill: #1A1A1A; } /* Flat Black Pocket */
      .sight { fill: #FFFFFF; } /* Flat White Sights */
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#222222" />

  <!-- Main Table Group (Centered) -->
  <g transform="translate(25, 25)">
    
    <!-- 1. Outer Table Frame (Total width: 500px, Total height: 1000px) -->
    <rect x="0" y="0" width="500" height="1000" rx="15" ry="15" class="rail" />

    <!-- 2. Inner Playing Surface (Exact 2:1 Ratio: 450px x 900px) -->
    <rect x="25" y="25" width="450" height="900" class="felt" />

    <!-- 3. Cushion Rails (Complex Paths for WPA Pocket Geometry) -->
    <g class="rail">
      <!-- Top Rail -->
      <path d="M 25 25 L 475 25 L 450 75 L 75 75 Z" />
      <!-- Bottom Rail -->
      <path d="M 25 975 L 475 975 L 450 925 L 75 925 Z" />
      <!-- Left Rail -->
      <path d="M 25 25 L 75 75 L 75 925 L 25 975 Z" />
      <!-- Right Rail -->
      <path d="M 475 25 L 450 75 L 450 925 L 475 975 Z" />
    </g>

    <!-- 4. Pocket Liners (Metal Bezels) -->
    <g class="metal">
      <!-- Top Left -->
      <path d="M 75 75 A 20 20 0 0 0 35 35 L 75 35 Z" transform="rotate(-45 75 75)" />
      <!-- Top Right -->
      <path d="M 425 75 A 20 20 0 0 1 465 35 L 425 35 Z" transform="rotate(45 425 75)" />
      <!-- Bottom Left -->
      <path d="M 75 925 A 20 20 0 0 1 35 965 L 75 965 Z" transform="rotate(45 75 925)" />
      <!-- Bottom Right -->
      <path d="M 425 925 A 20 20 0 0 0 465 965 L 425 965 Z" transform="rotate(-45 425 925)" />
      <!-- Side Left -->
      <path d="M 25 500 A 20 20 0 0 0 5 500 L 25 500 Z" />
      <!-- Side Right -->
      <path d="M 475 500 A 20 20 0 0 1 495 500 L 475 500 Z" />
    </g>

    <!-- 5. Pocket Openings (Dark Circles) -->
    <g class="pocket">
      <!-- Corner Pockets (Radius: 22.5px) -->
      <circle cx="25" cy="25" r="22.5" />
      <circle cx="475" cy="25" r="22.5" />
      <circle cx="25" cy="975" r="22.5" />
      <circle cx="475" cy="975" r="22.5" />
      <!-- Side Pockets (Radius: 25px) -->
      <circle cx="25" cy="500" r="25" />
      <circle cx="475" cy="500" r="25" />
    </g>

    <!-- 6. Rail Sights (White Diamonds) -->
    <g class="sight">
      <!-- Top Rail (Placed at 1/4, 1/2, 3/4 of the playing surface width) -->
      <rect x="137.5" y="10" width="5" height="10" transform="rotate(45 137.5 10)" />
      <rect x="250" y="10" width="5" height="10" transform="rotate(45 250 10)" />
      <rect x="362.5" y="10" width="5" height="10" transform="rotate(45 362.5 10)" />
      <!-- Bottom Rail -->
      <rect x="137.5" y="1030" width="5" height="10" transform="rotate(45 137.5 1030)" />
      <rect x="250" y="1030" width="5" height="10" transform="rotate(45 250 1030)" />
      <rect x="362.5" y="1030" width="5" height="10" transform="rotate(45 362.5 1030)" />
      <!-- Left Rail (Placed at 1/4, 1/2, 3/4 of the playing surface height) -->
      <rect x="10" y="237.5" width="5" height="10" transform="rotate(45 10 237.5)" />
      <rect x="10" y="500" width="5" height="10" transform="rotate(45 10 500)" />
      <rect x="10" y="762.5" width="5" height="10" transform="rotate(45 10 762.5)" />
      <!-- Right Rail -->
      <rect x="535" y="237.5" width="5" height="10" transform="rotate(45 535 237.5)" />
      <rect x="535" y="500" width="5" height="10" transform="rotate(45 535 500)" />
      <rect x="535" y="762.5" width="5" height="10" transform="rotate(45 535 762.5)" />
    </g>

  </g>
</svg>
