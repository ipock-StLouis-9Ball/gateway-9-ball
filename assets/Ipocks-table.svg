<svg width="450" height="800" viewBox="0 0 450 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and textures -->
  <defs>
    <!-- Clean Light Oak Wood Grain Pattern (Replaces the flawed texture) -->
    <pattern id="cleanWoodGrain" patternUnits="userSpaceOnUse" width="200" height="200">
      <image href="https://www.transparenttextures.com/patterns/light-wood.png" width="200" height="200" />
      <!-- This uses a clean, seamless light wood pattern from a public texture library -->
    </pattern>
    
    <!-- Felt Color -->
    <linearGradient id="feltGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d2b48c" /> <!-- Tan -->
      <stop offset="100%" stop-color="#c19a6b" /> <!-- Slightly darker tan -->
    </linearGradient>
    
    <!-- Metal Corner/Pocket Finish -->
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d1d5db" />
      <stop offset="50%" stop-color="#f3f4f6" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>
    
    <!-- Ruby Red Accent Color -->
    <radialGradient id="rubyRed" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#1a1a1a" />

  <!-- Pool Table Group -->
  <g transform="translate(25, 25)">
    
    <!-- Outer Table Frame (Wood) -->
    <rect x="0" y="0" width="400" height="750" rx="15" ry="15" fill="url(#cleanWoodGrain)" />

    <!-- Inner Felt Area -->
    <rect x="30" y="30" width="340" height="690" fill="url(#feltGradient)" />

    <!-- Cushion Rails (Wood) -->
    <g fill="url(#cleanWoodGrain)">
      <!-- Top Rail -->
      <path d="M 30 30 L 370 30 L 355 60 L 95 60 Z" />
      <!-- Bottom Rail -->
      <path d="M 30 720 L 370 720 L 355 690 L 95 690 Z" />
      <!-- Left Rail -->
      <path d="M 30 30 L 60 95 L 60 655 L 30 720 Z" />
      <!-- Right Rail -->
      <path d="M 370 30 L 340 95 L 340 655 L 370 720 Z" />
    </g>

    <!-- Pocket Liners (Metal) -->
    <g fill="url(#metalGradient)">
      <!-- Top Left -->
      <path d="M 30 30 A 20 20 0 0 0 10 50 L 30 50 Z" transform="rotate(-45 30 30)" />
      <!-- Top Right -->
      <path d="M 370 30 A 20 20 0 0 1 390 50 L 370 50 Z" transform="rotate(45 370 30)" />
      <!-- Bottom Left -->
      <path d="M 30 720 A 20 20 0 0 1 10 700 L 30 700 Z" transform="rotate(45 30 720)" />
      <!-- Bottom Right -->
      <path d="M 370 720 A 20 20 0 0 0 390 700 L 370 700 Z" transform="rotate(-45 370 720)" />
      <!-- Side Left -->
      <path d="M 30 375 A 20 20 0 0 0 10 375 L 30 375 Z" />
      <!-- Side Right -->
      <path d="M 370 375 A 20 20 0 0 1 390 375 L 370 375 Z" />
    </g>

    <!-- Pocket Openings (Dark) -->
    <g fill="#000">
      <!-- Top Left -->
      <circle cx="30" cy="30" r="18" />
      <!-- Top Right -->
      <circle cx="370" cy="30" r="18" />
      <!-- Bottom Left -->
      <circle cx="30" cy="720" r="18" />
      <!-- Bottom Right -->
      <circle cx="370" cy="720" r="18" />
      <!-- Side Left -->
      <circle cx="30" cy="375" r="18" />
      <!-- Side Right -->
      <circle cx="370" cy="375" r="18" />
    </g>

    <!-- Corner Metal Protectors -->
    <g fill="url(#metalGradient)">
      <path d="M 0 0 L 30 0 A 30 30 0 0 0 0 30 Z" />
      <path d="M 400 0 L 370 0 A 30 30 0 0 1 400 30 Z" />
      <path d="M 0 750 L 30 750 A 30 30 0 0 1 0 720 Z" />
      <path d="M 400 750 L 370 750 A 30 30 0 0 0 400 720 Z" />
    </g>

    <!-- Rail Sights (Ruby Red Dots) -->
    <g fill="url(#rubyRed)">
      <!-- Top Rail -->
      <circle cx="100" cy="15" r="4" />
      <circle cx="200" cy="15" r="4" />
      <circle cx="300" cy="15" r="4" />
      <!-- Bottom Rail -->
      <circle cx="100" cy="735" r="4" />
      <circle cx="200" cy="735" r="4" />
      <circle cx="300" cy="735" r="4" />
      <!-- Left Rail -->
      <circle cx="15" cy="100" r="4" />
      <circle cx="15" cy="200" r="4" />
      <circle cx="15" cy="300" r="4" />
      <circle cx="15" cy="450" r="4" />
      <circle cx="15" cy="550" r="4" />
      <circle cx="15" cy="650" r="4" />
      <!-- Right Rail -->
      <circle cx="385" cy="100" r="4" />
      <circle cx="385" cy="200" r="4" />
      <circle cx="385" cy="300" r="4" />
      <circle cx="385" cy="450" r="4" />
      <circle cx="385" cy="550" r="4" />
      <circle cx="385" cy="650" r="4" />
    </g>

  </g>
</svg>
