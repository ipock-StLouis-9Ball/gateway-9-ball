<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Deep Drop Shadow for Pocket Cavities -->
    <filter id="pocket-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- Flat Technical Weave Pattern -->
    <pattern id="cloth-weave" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#000000" fill-opacity="0.12" />
      <rect x="2" y="2" width="2" height="2" fill="#000000" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Ground Layer: Deep Black Pocket Void Wells (Outward-Shifted) -->
  <g id="black-pocket-wells" fill="#0a0203" filter="url(#pocket-shadow)">
    <!-- Corners shifted diagonally outward by 10px from the 100px boundary -->
    <circle cx="90" cy="90" r="50" />
    <circle cx="1830" cy="90" r="50" />
    <circle cx="90" cy="990" r="50" />
    <circle cx="1830" cy="990" r="50" />
    <!-- Side pockets shifted vertically outward by 10px -->
    <circle cx="960" cy="90" r="50" />
    <circle cx="960" cy="990" r="50" />
  </g>

  <!-- Main Felt Layer: Flat Cardinals Red (Hex #C41E3A) with Evenodd Pocket Cutouts -->
  <path d="M 100,100 L 1820,100 L 1820,980 L 100,980 Z
           M 40,90 A 50,50 0 1,0 140,90 A 50,50 0 1,0 40,90 Z
           M 1780,90 A 50,50 0 1,0 1880,90 A 50,50 0 1,0 1780,90 Z
           M 40,990 A 50,50 0 1,0 140,990 A 50,50 0 1,0 40,990 Z
           M 1780,990 A 50,50 0 1,0 1880,990 A 50,50 0 1,0 1780,990 Z
           M 910,90 A 50,50 0 1,0 1010,90 A 50,50 0 1,0 910,90 Z
           M 910,990 A 50,50 0 1,0 1010,990 A 50,50 0 1,0 910,990 Z"
        fill="#c41e3a" fill-rule="evenodd" />

  <!-- Textured Overlay Layer: Identical Geometry applying Flat Cloth Weave -->
  <path d="M 100,100 L 1820,100 L 1820,980 L 100,980 Z
           M 40,90 A 50,50 0 1,0 140,90 A 50,50 0 1,0 40,90 Z
           M 1780,90 A 50,50 0 1,0 1880,90 A 50,50 0 1,0 1780,90 Z
           M 40,990 A 50,50 0 1,0 140,990 A 50,50 0 1,0 40,990 Z
           M 1780,990 A 50,50 0 1,0 1880,990 A 50,50 0 1,0 1780,990 Z
           M 910,90 A 50,50 0 1,0 1010,90 A 50,50 0 1,0 910,90 Z
           M 910,990 A 50,50 0 1,0 1010,990 A 50,50 0 1,0 910,990 Z"
        fill="url(#cloth-weave)" fill-rule="evenodd" />
</svg>
