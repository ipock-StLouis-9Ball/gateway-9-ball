<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and filters -->
  <defs>
    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="100%" stop-color="#1a252f" />
    </linearGradient>
    <linearGradient id="cueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a76a" />
      <stop offset="50%" stop-color="#f8e7c1" />
      <stop offset="100%" stop-color="#d4a76a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background (Checkerboard pattern) -->
  <rect width="100%" height="100%" fill="#111" />
  <pattern id="checkerboard" patternUnits="userSpaceOnUse" width="40" height="40">
    <rect width="20" height="20" fill="#222" />
    <rect x="20" y="20" width="20" height="20" fill="#222" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#checkerboard)" />

  <!-- Main Container Group -->
  <g transform="translate(300, 60)" filter="url(#dropShadow)">
    
    <!-- Left Panel: Power Meter -->
    <rect x="0" y="0" width="160" height="600" rx="15" ry="15" fill="url(#panelGradient)" stroke="#444" stroke-width="1" />
    
    <!-- Power Meter Track and Ticks -->
    <g transform="translate(80, 30)">
      <line x1="0" y1="0" x2="0" y2="540" stroke="#34495e" stroke-width="8" stroke-linecap="round" />
      <line x1="0" y1="0" x2="0" y2="135" stroke="#00bcd4" stroke-width="8" stroke-linecap="round" /> <!-- Active Power (25%) -->
      
      <!-- Ticks and Labels -->
      <g stroke="#7f8c8d" stroke-width="2">
        <line x1="15" y1="0" x2="35" y2="0" />
        <line x1="15" y1="135" x2="35" y2="135" />
        <line x1="15" y1="270" x2="35" y2="270" />
        <line x1="15" y1="405" x2="35" y2="405" />
        <line x1="15" y1="540" x2="35" y2="540" />
      </g>
      <g fill="#bdc3c7" font-family="Arial, sans-serif" font-size="16" text-anchor="start">
        <text x="45" y="5">25%</text>
        <text x="45" y="140">50%</text>
        <text x="45" y="275">75%</text>
        <text x="45" y="410">75%</text>
        <text x="45" y="545">100%</text>
      </g>
    </g>

    <!-- Pool Cue -->
    <g transform="translate(80, 30)">
      <rect x="-10" y="0" width="20" height="540" rx="5" ry="5" fill="url(#cueGradient)" />
      <!-- Cue Tip -->
      <rect x="-12" y="-10" width="24" height="10" fill="#fff" rx="2" ry="2" />
      <!-- Cue Butt Details -->
      <rect x="-12" y="500" width="24" height="40" fill="#1a252f" />
      <rect x="-10" y="505" width="20" height="5" fill="#d4a76a" />
      <rect x="-10" y="530" width="20" height="5" fill="#d4a76a" />
    </g>

    <!-- Right Panel: Player Info and Controls -->
    <rect x="180" y="0" width="160" height="600" rx="15" ry="15" fill="url(#panelGradient)" stroke="#444" stroke-width="1" />

    <!-- Player 1 Section -->
    <g transform="translate(200, 30)">
      <rect x="0" y="0" width="120" height="120" rx="10" ry="10" fill="#34495e" stroke="#7f8c8d" stroke-width="1" />
      <!-- User Icon -->
      <circle cx="60" cy="50" r="30" fill="#bdc3c7" />
      <path d="M60 90 C 40 90, 20 105, 20 120 L 100 120 C 100 105, 80 90, 60 90 Z" fill="#bdc3c7" />
      <!-- Player 1 Text -->
      <rect x="10" y="130" width="100" height="25" rx="5" ry="5" fill="#2c3e50" />
      <text x="60" y="148" font-family="Arial, sans-serif" font-size="14" fill="#ecf0f1" text-anchor="middle">PLAYER 1</text>
    </g>

    <!-- Timer Section -->
    <g transform="translate(200, 200)">
      <circle cx="60" cy="60" r="55" fill="#2c3e50" stroke="#00bcd4" stroke-width="4" />
      <text x="60" y="70" font-family="Courier New, monospace" font-size="36" fill="#ecf0f1" text-anchor="middle" font-weight="bold">00:45</text>
    </g>

    <!-- Cue Ball Control Section -->
    <g transform="translate(200, 350)">
      <circle cx="60" cy="60" r="55" fill="#2c3e50" stroke="#7f8c8d" stroke-width="1" />
      <!-- Cue Ball -->
      <circle cx="60" cy="60" r="35" fill="#fff" stroke="#95a5a6" stroke-width="1" />
      <!-- Red Dot -->
      <circle cx="60" cy="60" r="5" fill="#e74c3c" />
      <!-- Directional Indicators -->
      <path d="M60 10 L 50 25 L 70 25 Z" fill="#7f8c8d" /> <!-- Up -->
      <path d="M110 60 L 95 50 L 95 70 Z" fill="#7f8c8d" /> <!-- Right -->
      <path d="M60 110 L 50 95 L 70 95 Z" fill="#7f8c8d" /> <!-- Down -->
      <path d="M10 60 L 25 50 L 25 70 Z" fill="#7f8c8d" /> <!-- Left -->
    </g>

    <!-- Player 2 Section -->
    <g transform="translate(200, 480)">
      <rect x="0" y="0" width="120" height="120" rx="10" ry="10" fill="#34495e" stroke="#7f8c8d" stroke-width="1" />
      <!-- User Icon -->
      <circle cx="60" cy="50" r="30" fill="#bdc3c7" />
      <path d="M60 90 C 40 90, 20 105, 20 120 L 100 120 C 100 105, 80 90, 60 90 Z" fill="#bdc3c7" />
      <!-- Player 2 Text -->
      <rect x="10" y="130" width="100" height="25" rx="5" ry="5" fill="#2c3e50" />
      <text x="60" y="148" font-family="Arial, sans-serif" font-size="14" fill="#ecf0f1" text-anchor="middle">PLAYER 2</text>
    </g>

  </g>
</svg>
