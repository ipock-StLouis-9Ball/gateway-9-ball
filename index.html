<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St. Louis 9-Ball Table</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="table-container">
        <!-- Outer Table Frame (Total Rail Assembly: 5 Inches Total Width) -->
        <div class="table-frame">
            
            <!-- Wood Rail Structure (3.0-Inch Outer Framework) -->
            <div class="wood-rails">
                
                <!-- Rail Sights (Ruby Red Diamond Inlays - #ff0000) -->
                <!-- Top Rail Sights -->
                <div class="sight top-sight" style="left: 25%;"></div>
                <div class="sight top-sight" style="left: 50%;"></div>
                <div class="sight top-sight" style="left: 75%;"></div>
                
                <!-- Bottom Rail Sights -->
                <div class="sight bottom-sight" style="left: 25%;"></div>
                <div class="sight bottom-sight" style="left: 50%;"></div>
                <div class="sight bottom-sight" style="left: 75%;"></div>

                <!-- Left & Right Rail Sights -->
                <div class="sight left-sight" style="top: 25%;"></div>
                <div class="sight left-sight" style="top: 50%;"></div>
                <div class="sight left-sight" style="top: 75%;"></div>
                <div class="sight right-sight" style="top: 25%;"></div>
                <div class="sight right-sight" style="top: 50%;"></div>
                <div class="sight right-sight" style="top: 75%;"></div>

                <!-- Inner Rubber Cushion Profile (Exact 2.0-Inch Width Profile) -->
                <div class="cushion-system">
                    
                    <!-- Felt Playing Surface (#d1b399 Beach Blond Sand) -->
                    <div class="felt">
                        <!-- Playfield canvas synced pixel-for-pixel with physics -->
                        <canvas id="gameCanvas" width="1240" height="540"></canvas>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Core Game & Physics Scripts -->
    <script src="js/config.js"></script>
    <script src="js/rapierPhysics.js"></script>
    <script src="js/renderer.js"></script>
</body>
</html>
